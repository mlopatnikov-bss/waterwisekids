<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A child wrapped in a towel at the edge of a pool beside a clock and a symptom watch log card with rows to check breathing, cough, colour and alertness">
  <defs>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="ws-pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#ws-bg)"/>
  <!-- pool -->
  <rect x="0" y="250" width="600" height="110" fill="url(#ws-pool)"/>
  <rect x="0" y="238" width="600" height="14" fill="#e2e8f0"/>
  <path d="M0 280 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.55"/>
  <path d="M0 318 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.35"/>
  <!-- child in towel -->
  <circle cx="120" cy="150" r="30" fill="#fcd9b6"/>
  <path d="M92 142 q28 -34 58 -4 q-8 -26 -30 -26 q-24 0 -28 30 z" fill="#78350f"/>
  <circle cx="110" cy="152" r="3" fill="#1f2937"/>
  <circle cx="131" cy="152" r="3" fill="#1f2937"/>
  <path d="M112 166 q9 5 18 0" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M70 238 q2 -62 50 -62 q48 0 50 62 z" fill="#f97316"/>
  <path d="M84 238 q4 -48 36 -50 q32 2 36 50" fill="none" stroke="#fdba74" stroke-width="5"/>
  <!-- adult hand on shoulder -->
  <path d="M170 190 q-14 -6 -24 4" fill="none" stroke="#e8b48a" stroke-width="12" stroke-linecap="round"/>
  <!-- clock -->
  <circle cx="250" cy="110" r="44" fill="#ffffff" stroke="#0369a1" stroke-width="5"/>
  <line x1="250" y1="110" x2="250" y2="80" stroke="#0c4a6e" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="110" x2="272" y2="118" stroke="#0c4a6e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250" cy="110" r="4" fill="#0c4a6e"/>
  <text x="250" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">0 &#8594; 8 hours</text>
  <!-- log card -->
  <rect x="330" y="34" width="236" height="196" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <rect x="330" y="34" width="236" height="38" rx="12" fill="#0369a1"/>
  <rect x="330" y="58" width="236" height="14" fill="#0369a1"/>
  <text x="448" y="59" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">SYMPTOM WATCH LOG</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1f2937">
    <rect x="348" y="86" width="14" height="14" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/>
    <path d="M351 93 l3 4 l6 -8" fill="none" stroke="#16a34a" stroke-width="2.4"/>
    <text x="372" y="98">Breathing</text>
    <rect x="348" y="114" width="14" height="14" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/>
    <path d="M351 121 l3 4 l6 -8" fill="none" stroke="#16a34a" stroke-width="2.4"/>
    <text x="372" y="126">Cough</text>
    <rect x="348" y="142" width="14" height="14" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/>
    <text x="372" y="154">Colour (lips)</text>
    <rect x="348" y="170" width="14" height="14" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/>
    <text x="372" y="182">Alert &amp; themselves</text>
  </g>
  <rect x="348" y="198" width="200" height="20" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="448" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Getting worse? Call. Blue lips? 911.</text>
</svg>
