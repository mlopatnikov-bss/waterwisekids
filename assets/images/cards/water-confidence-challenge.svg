<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="30-Day Water Confidence Challenge calendar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>
  <!-- Calendar sheet -->
  <rect x="30" y="30" width="150" height="126" rx="8" fill="#ffffff"/>
  <rect x="30" y="30" width="150" height="24" rx="8" fill="#0284c7"/>
  <rect x="30" y="44" width="150" height="10" fill="#0284c7"/>
  <text x="105" y="47" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">30-DAY CHALLENGE</text>
  <!-- grid dots -->
  <g fill="#e0f2fe" stroke="#bae6fd" stroke-width="1">
    <rect x="40" y="62" width="18" height="16" rx="3"/>
    <rect x="63" y="62" width="18" height="16" rx="3"/>
    <rect x="86" y="62" width="18" height="16" rx="3"/>
    <rect x="109" y="62" width="18" height="16" rx="3"/>
    <rect x="132" y="62" width="18" height="16" rx="3"/>
    <rect x="153" y="62" width="18" height="16" rx="3"/>
    <rect x="40" y="83" width="18" height="16" rx="3"/>
    <rect x="63" y="83" width="18" height="16" rx="3"/>
    <rect x="86" y="83" width="18" height="16" rx="3"/>
    <rect x="109" y="83" width="18" height="16" rx="3"/>
    <rect x="132" y="83" width="18" height="16" rx="3"/>
    <rect x="153" y="83" width="18" height="16" rx="3"/>
    <rect x="40" y="104" width="18" height="16" rx="3"/>
    <rect x="63" y="104" width="18" height="16" rx="3"/>
    <rect x="86" y="104" width="18" height="16" rx="3"/>
    <rect x="109" y="104" width="18" height="16" rx="3"/>
    <rect x="132" y="104" width="18" height="16" rx="3"/>
    <rect x="153" y="104" width="18" height="16" rx="3"/>
    <rect x="40" y="125" width="18" height="16" rx="3"/>
    <rect x="63" y="125" width="18" height="16" rx="3"/>
    <rect x="86" y="125" width="18" height="16" rx="3"/>
  </g>
  <!-- check marks on some days -->
  <g stroke="#059669" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 70 l3 4 l6 -8"/>
    <path d="M67 70 l3 4 l6 -8"/>
    <path d="M90 70 l3 4 l6 -8"/>
    <path d="M44 91 l3 4 l6 -8"/>
    <path d="M67 91 l3 4 l6 -8"/>
  </g>
  <!-- star reward -->
  <path d="M167 128 l2.4 5 l5.4 .6 l-4 3.7 l1.1 5.3 l-4.9 -2.7 l-4.9 2.7 l1.1 -5.3 l-4 -3.7 l5.4 -.6 z" fill="#fbbf24"/>
  <!-- water + swimmer -->
  <path d="M195 120 q10 -8 20 0 t20 0 t20 0 t20 0 v40 h-100 z" fill="rgba(255,255,255,0.18)"/>
  <circle cx="228" cy="96" r="9" fill="#fcd34d"/>
  <rect x="222" y="105" width="12" height="20" rx="6" fill="#f97316"/>
  <text x="240" y="52" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Scared</text>
  <text x="240" y="70" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">to</text>
  <text x="240" y="88" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="middle">Swimming</text>
</svg>
