<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="One swim instructor in a pool with several children, and a parent on the deck counting them on a clipboard">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="300" height="180" fill="url(#sky)"/>

  <!-- tally bubble -->
  <g opacity="0.9">
    <rect x="176" y="14" width="72" height="30" rx="15" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <path d="M196 44 l0 9 l10 -9 z" fill="#ffffff" stroke="#bae6fd" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#0369a1" stroke-width="3" stroke-linecap="round">
      <line x1="190" y1="24" x2="190" y2="36"/>
      <line x1="198" y1="24" x2="198" y2="36"/>
      <line x1="206" y1="24" x2="206" y2="36"/>
      <line x1="214" y1="24" x2="214" y2="36"/>
      <line x1="186" y1="37" x2="218" y2="23"/>
    </g>
    <text x="234" y="35" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0369a1" text-anchor="middle">?</text>
  </g>

  <!-- pool deck -->
  <rect y="112" width="300" height="10" fill="#e2e8f0"/>
  <rect y="112" width="300" height="3" fill="#cbd5e1"/>

  <!-- water -->
  <rect y="122" width="300" height="58" fill="url(#water)"/>
  <g stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M8 170 q10 -6 20 0 t20 0"/>
    <path d="M150 172 q10 -6 20 0 t20 0"/>
    <path d="M246 166 q10 -6 20 0 t20 0"/>
  </g>

  <!-- one instructor (taller, red suit, whistle) in the water -->
  <g>
    <circle cx="112" cy="112" r="12" fill="#e8b58a"/>
    <path d="M100 110 a12 12 0 0 1 24 0 q-12 -7 -24 0 z" fill="#1f2937"/>
    <path d="M101 148 v-22 a11 11 0 0 1 22 0 v22 z" fill="#dc2626"/>
    <circle cx="112" cy="133" r="3.5" fill="#fbbf24" stroke="#f8fafc" stroke-width="1.2"/>
    <ellipse cx="112" cy="148" rx="16" ry="5" fill="#0c4a6e" opacity="0.28"/>
  </g>

  <!-- four smaller children in the water -->
  <g>
    <circle cx="152" cy="128" r="8" fill="#fcd9b8"/>
    <path d="M144 126 a8 8 0 0 1 16 0 q-8 -5 -16 0 z" fill="#7c4a21"/>
    <path d="M145 150 v-14 a7 7 0 0 1 14 0 v14 z" fill="#f472b6"/>
    <ellipse cx="152" cy="150" rx="11" ry="4" fill="#0c4a6e" opacity="0.28"/>
  </g>
  <g>
    <circle cx="188" cy="132" r="8" fill="#e8b58a"/>
    <path d="M180 130 a8 8 0 0 1 16 0 q-8 -5 -16 0 z" fill="#1f2937"/>
    <path d="M181 154 v-14 a7 7 0 0 1 14 0 v14 z" fill="#22c55e"/>
    <ellipse cx="188" cy="154" rx="11" ry="4" fill="#0c4a6e" opacity="0.28"/>
  </g>
  <g>
    <circle cx="224" cy="128" r="8" fill="#fcd9b8"/>
    <path d="M216 126 a8 8 0 0 1 16 0 q-8 -5 -16 0 z" fill="#facc15"/>
    <path d="M217 150 v-14 a7 7 0 0 1 14 0 v14 z" fill="#f97316"/>
    <ellipse cx="224" cy="150" rx="11" ry="4" fill="#0c4a6e" opacity="0.28"/>
  </g>
  <g>
    <circle cx="260" cy="133" r="8" fill="#c68642"/>
    <path d="M252 131 a8 8 0 0 1 16 0 q-8 -5 -16 0 z" fill="#3f2a14"/>
    <path d="M253 155 v-14 a7 7 0 0 1 14 0 v14 z" fill="#a855f7"/>
    <ellipse cx="260" cy="155" rx="11" ry="4" fill="#0c4a6e" opacity="0.28"/>
  </g>

  <!-- parent on the deck with clipboard, counting -->
  <g>
    <circle cx="42" cy="66" r="13" fill="#fcd9b8"/>
    <path d="M29 64 a13 13 0 0 1 26 0 q-13 -7 -26 0 z" fill="#5b3a1a"/>
    <path d="M28 112 v-28 a14 14 0 0 1 28 0 v28 z" fill="#0ea5e9"/>
    <rect x="50" y="84" width="24" height="29" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="57" y="81" width="10" height="6" rx="2" fill="#94a3b8"/>
    <g stroke="#0369a1" stroke-width="2.5" stroke-linecap="round">
      <line x1="56" y1="94" x2="56" y2="102"/>
      <line x1="61" y1="94" x2="61" y2="102"/>
      <line x1="66" y1="94" x2="66" y2="102"/>
      <line x1="53" y1="103" x2="69" y2="93"/>
      <line x1="56" y1="109" x2="68" y2="109"/>
    </g>
  </g>
</svg>
