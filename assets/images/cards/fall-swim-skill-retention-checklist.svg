<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Fall swim skill-retention checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- sun low in the autumn sky -->
  <circle cx="500" cy="80" r="42" fill="#fdba74" opacity="0.7"/>
  <!-- indoor pool water -->
  <rect x="0" y="250" width="600" height="110" fill="url(#water)"/>
  <!-- lane line -->
  <path d="M0 300 h600" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="14 10" opacity="0.7"/>
  <!-- ripples -->
  <path d="M40 282 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M70 330 q30 -10 60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- young swimmer doing a back float -->
  <g transform="translate(150,272)">
    <ellipse cx="0" cy="18" rx="70" ry="12" fill="#0ea5e9" opacity="0.35"/>
    <!-- body -->
    <rect x="-46" y="4" width="86" height="14" rx="7" fill="#fbbf24"/>
    <!-- head -->
    <circle cx="48" cy="11" r="13" fill="#fcd9b6"/>
    <path d="M36 6 a12 12 0 0 1 24 0 z" fill="#7c3f0e"/>
    <!-- arm -->
    <rect x="-52" y="0" width="22" height="7" rx="3.5" fill="#fcd9b6"/>
  </g>
  <!-- falling autumn leaves -->
  <g>
    <path d="M120 70 q10 -14 22 -6 q-2 14 -14 18 q-10 -4 -8 -12 z" fill="#ea580c"/>
    <path d="M230 110 q9 -12 20 -5 q-2 13 -13 16 q-9 -3 -7 -11 z" fill="#d97706"/>
    <path d="M80 150 q8 -11 18 -5 q-2 12 -12 15 q-8 -3 -6 -10 z" fill="#b45309"/>
    <path d="M300 60 q9 -12 20 -5 q-2 13 -13 16 q-9 -3 -7 -11 z" fill="#f59e0b"/>
    <path d="M180 40 q8 -11 18 -5 q-2 12 -12 15 q-8 -3 -6 -10 z" fill="#c2410c"/>
  </g>
  <!-- calendar + checklist badge -->
  <g transform="translate(392,150)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- mini calendar -->
    <g transform="translate(22,26)">
      <rect x="0" y="6" width="46" height="42" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <rect x="0" y="6" width="46" height="12" rx="6" fill="#ea580c"/>
      <rect x="9" y="0" width="5" height="10" rx="2.5" fill="#9a3412"/>
      <rect x="32" y="0" width="5" height="10" rx="2.5" fill="#9a3412"/>
      <line x1="8" y1="28" x2="38" y2="28" stroke="#fdba74" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="38" x2="30" y2="38" stroke="#fdba74" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- checklist lines -->
    <g transform="translate(80,30)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 9 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="4" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="30" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 39 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="34" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="60" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 69 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="64" width="34" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>
  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#9a3412"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Fall Swim Skill-Retention Checklist</text>
</svg>
