<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A house with an open door and an alarm above a pool, beside a wandering and water safety plan card listing secure home, ID plan, check water first and swim lessons">
  <defs>
    <linearGradient id="aw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="aw-pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#aw-bg)"/>
  <!-- house -->
  <rect x="60" y="150" width="150" height="110" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <path d="M50 155 l85 -55 l85 55 z" fill="#0369a1"/>
  <!-- open door -->
  <rect x="150" y="185" width="46" height="75" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <path d="M150 185 l40 -8 v90 l-40 -7 z" fill="#bae6fd" stroke="#0369a1" stroke-width="2" opacity="0.9"/>
  <!-- footprints leaving the door toward the pool -->
  <g fill="#f97316" opacity="0.9">
    <ellipse cx="205" cy="252" rx="6" ry="9" transform="rotate(20 205 252)"/>
    <ellipse cx="228" cy="262" rx="6" ry="9" transform="rotate(25 228 262)"/>
    <ellipse cx="253" cy="268" rx="6" ry="9" transform="rotate(15 253 268)"/>
  </g>
  <!-- alarm burst above house -->
  <circle cx="205" cy="110" r="22" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/>
  <text x="205" y="119" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#9a3412">!</text>
  <!-- water -->
  <rect x="0" y="272" width="400" height="88" fill="url(#aw-pool)"/>
  <path d="M0 272 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.85"/>
  <path d="M40 305 q20 -7 40 0 t40 0 M230 320 q20 -7 40 0 t40 0" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.6"/>
  <!-- plan card -->
  <rect x="408" y="30" width="176" height="250" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <rect x="408" y="30" width="176" height="36" rx="12" fill="#0369a1"/>
  <rect x="408" y="54" width="176" height="12" fill="#0369a1"/>
  <text x="496" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff">WANDERING PLAN</text>
  <g font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1f2937">
    <g><rect x="422" y="80" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><path d="M425 87 l3 3 l5 -7" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="444" y="92">Secure home</text></g>
    <g><rect x="422" y="108" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><path d="M425 115 l3 3 l5 -7" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="444" y="120">ID &amp; photo</text></g>
    <g><rect x="422" y="136" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><path d="M425 143 l3 3 l5 -7" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="444" y="148">Trusted neighbors</text></g>
    <g><rect x="422" y="164" width="13" height="13" rx="3" fill="none" stroke="#9a3412" stroke-width="2"/><text x="444" y="176" fill="#9a3412" font-weight="700">Check water first</text></g>
    <g><rect x="422" y="192" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><text x="444" y="204">Call 911</text></g>
    <g><rect x="422" y="220" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><text x="444" y="232">Swim lessons</text></g>
  </g>
  <rect x="400" y="300" width="200" height="60" fill="#e2e8f0"/>
</svg>
