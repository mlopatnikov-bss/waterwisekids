    <g fill="#64748b" font-size="12" font-weight="700"><text x="110" y="104">MON</text><text x="170" y="104">TUE</text><text x="230" y="104">WED</text><text x="290" y="104">THU</text><text x="350" y="104">FRI</text></g>
    <rect x="86" y="114" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="110" y="137">1</text>
    <rect x="146" y="114" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="170" y="137">2</text>
