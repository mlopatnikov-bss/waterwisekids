<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A wall calendar with two missed swim classes crossed out, a make-up class circled, and a swim bag beside it">
  <defs>
    <linearGradient id="mk-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="mk-pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#mk-bg)"/>
  <rect x="0" y="290" width="600" height="70" fill="url(#mk-pool)"/>
  <path d="M0 308 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.7"/>
  <!-- calendar -->
