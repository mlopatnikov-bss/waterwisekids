    <rect x="266" y="114" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="290" y="137">4</text>
    <rect x="326" y="114" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="350" y="137">5</text>
    <rect x="86" y="158" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="110" y="181">8</text>
    <rect x="146" y="158" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="170" y="181">9</text>
    <rect x="206" y="158" width="48" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="230" y="181">10</text><path d="M212 162 L248 188 M248 162 L212 188" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <rect x="266" y="158" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="290" y="181">11</text>
    <rect x="326" y="158" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="350" y="181">12</text>
    <rect x="86" y="202" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="110" y="225">15</text>
    <rect x="146" y="202" width="48" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="170" y="225">16</text><path d="M155 246 h30" stroke="#16a34a" stroke-width="0"/>
    <rect x="206" y="202" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="230" y="225">17</text>
    <rect x="266" y="202" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="290" y="225">18</text>
    <rect x="326" y="202" width="48" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/><text x="350" y="225">19</text>
