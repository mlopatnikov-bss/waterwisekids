<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Hot tub and spa safety checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- ground / deck -->
  <rect x="0" y="256" width="600" height="104" fill="#eef2f7"/>
  <rect x="48" y="214" width="504" height="120" rx="16" fill="#cbd5e1"/>
  <rect x="60" y="226" width="480" height="96" rx="12" fill="#e2e8f0"/>

  <!-- hot tub body -->
  <ellipse cx="240" cy="292" rx="150" ry="42" fill="url(#tub)"/>
  <ellipse cx="240" cy="270" rx="150" ry="44" fill="url(#tub)"/>
  <rect x="90" y="270" width="300" height="24" fill="url(#tub)"/>
  <ellipse cx="240" cy="270" rx="150" ry="44" fill="#92400e"/>
  <!-- water surface -->
  <ellipse cx="240" cy="266" rx="132" ry="34" fill="url(#water)"/>
  <ellipse cx="240" cy="266" rx="132" ry="34" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.7"/>

  <!-- jets / bubbles -->
  <circle cx="200" cy="262" r="6" fill="#e0f2fe" opacity="0.85"/>
  <circle cx="228" cy="272" r="4" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="262" cy="260" r="7" fill="#e0f2fe" opacity="0.85"/>
  <circle cx="286" cy="270" r="4" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="216" cy="276" r="3" fill="#e0f2fe" opacity="0.8"/>

  <!-- steam -->
  <path d="M195 236 q-10 -18 4 -34 q12 -14 2 -30" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M245 232 q-10 -18 4 -34 q12 -14 2 -30" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M295 236 q-10 -18 4 -34 q12 -14 2 -30" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- thermometer badge -->
  <g transform="translate(392,150)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- thermometer -->
    <rect x="34" y="26" width="14" height="70" rx="7" fill="#e2e8f0"/>
    <rect x="34" y="52" width="14" height="44" rx="7" fill="#ef4444"/>
    <circle cx="41" cy="104" r="16" fill="#ef4444"/>
    <line x1="54" y1="40" x2="66" y2="40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="58" x2="66" y2="58" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="76" x2="66" y2="76" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- checklist lines -->
    <g transform="translate(80,30)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 9 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="4" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="30" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 39 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="34" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="60" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 69 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="64" width="34" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#0c4a6e"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Hot Tub &amp; Spa Safety Checklist for Kids</text>
</svg>
