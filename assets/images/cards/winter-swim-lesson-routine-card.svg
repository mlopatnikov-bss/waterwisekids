<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A child in a hooded towel and winter hat walking from an indoor pool toward a car in the snow, beside a routine card listing towel, rinse, dry, dress, hat and car seat">
  <defs>
    <linearGradient id="wr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="wr-pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#wr-bg)"/>
  <!-- snowflakes -->
  <g fill="#ffffff" stroke="#93c5fd" stroke-width="1">
    <circle cx="40" cy="40" r="4"/><circle cx="110" cy="24" r="3"/><circle cx="190" cy="52" r="4"/><circle cx="260" cy="20" r="3"/><circle cx="300" cy="70" r="3"/><circle cx="70" cy="96" r="3"/><circle cx="230" cy="100" r="4"/>
  </g>
  <!-- ground with snow -->
  <rect x="0" y="300" width="600" height="60" fill="#e2e8f0"/>
  <path d="M0 300 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" fill="#ffffff"/>
  <!-- pool window -->
  <rect x="18" y="170" width="120" height="84" rx="8" fill="url(#wr-pool)" stroke="#0369a1" stroke-width="3"/>
  <path d="M26 212 q14 -6 28 0 t28 0 t28 0 t28 0" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.7"/>
  <text x="78" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0c4a6e">WARM POOL</text>
  <!-- child in hooded towel -->
  <path d="M150 300 q2 -78 46 -80 q44 2 46 80 z" fill="#f97316"/>
  <circle cx="196" cy="196" r="26" fill="#fcd9b6"/>
  <path d="M166 200 q0 -46 30 -46 q30 0 30 46 q-4 -30 -30 -32 q-26 2 -30 32 z" fill="#f97316"/>
  <path d="M170 170 q26 -26 52 0" fill="none" stroke="#0369a1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="186" cy="198" r="3" fill="#1f2937"/>
  <circle cx="206" cy="198" r="3" fill="#1f2937"/>
  <path d="M187 210 q9 6 18 0" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <!-- arrow to car -->
  <path d="M252 280 h40" stroke="#0369a1" stroke-width="4" stroke-linecap="round"/>
  <path d="M288 272 l10 8 l-10 8" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- car -->
  <path d="M300 300 v-26 q0 -8 8 -10 l18 -22 q4 -4 10 -4 h40 q6 0 10 4 l18 22 q8 2 8 10 v26 z" fill="#0369a1"/>
  <rect x="332" y="244" width="24" height="18" rx="3" fill="#bae6fd"/>
  <rect x="362" y="244" width="24" height="18" rx="3" fill="#bae6fd"/>
  <circle cx="328" cy="302" r="11" fill="#1f2937"/><circle cx="390" cy="302" r="11" fill="#1f2937"/>
  <!-- routine card -->
  <rect x="408" y="30" width="176" height="220" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <rect x="408" y="30" width="176" height="36" rx="12" fill="#0369a1"/>
  <rect x="408" y="54" width="176" height="12" fill="#0369a1"/>
  <text x="496" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">POOL &#8594; CAR</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1f2937">
    <g><rect x="422" y="80" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><path d="M425 87 l3 3 l5 -7" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="444" y="92">Towel + hood</text></g>
    <g><rect x="422" y="108" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><path d="M425 115 l3 3 l5 -7" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="444" y="120">Warm rinse</text></g>
    <g><rect x="422" y="136" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><path d="M425 143 l3 3 l5 -7" fill="none" stroke="#16a34a" stroke-width="2.2"/><text x="444" y="148">Hair + ears</text></g>
    <g><rect x="422" y="164" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><text x="444" y="176">Dress core first</text></g>
    <g><rect x="422" y="192" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><text x="444" y="204">Hat on</text></g>
    <g><rect x="422" y="220" width="13" height="13" rx="3" fill="none" stroke="#0369a1" stroke-width="2"/><text x="444" y="232">Coat over straps</text></g>
  </g>
</svg>
