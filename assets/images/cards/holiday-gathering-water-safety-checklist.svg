      <rect x="12" y="166" width="146" height="34" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="44" y="188">Drain the tub</text><path d="M20 184 l5 5 l10 -12" fill="none" stroke="#16a34a" stroke-width="3.5"/>
