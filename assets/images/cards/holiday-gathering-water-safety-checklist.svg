  <ellipse cx="110" cy="244" rx="46" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="220" cy="244" rx="46" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="110" cy="240" rx="28" ry="12" fill="#f59e0b"/><ellipse cx="220" cy="240" rx="28" ry="12" fill="#b45309"/>
  <g transform="translate(400 70)">
