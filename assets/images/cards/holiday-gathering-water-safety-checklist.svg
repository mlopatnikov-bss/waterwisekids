    <linearGradient id="hg-pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#hg-bg)"/>
  <rect x="30" y="30" width="250" height="170" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <rect x="30" y="130" width="250" height="70" fill="url(#hg-pool)"/>
  <path d="M30 150 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.8"/>
