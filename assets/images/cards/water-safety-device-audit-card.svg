<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="An audit card listing pool safety devices with prevent and announce marks, beside a fenced pool where a gate alarm and a floating alarm sit silent with a flat battery">
  <defs>
    <linearGradient id="da-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="da-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#da-bg)"/>

  <!-- audit card, left -->
  <rect x="32" y="44" width="240" height="272" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="32" y="44" width="240" height="38" rx="10" fill="#0369a1"/>
  <rect x="32" y="70" width="240" height="12" fill="#0369a1"/>
  <text x="52" y="69" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Device Audit</text>

  <!-- column heads -->
  <text x="52" y="102" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0c4a6e">DEVICE</text>
  <text x="196" y="102" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0c4a6e">P / A</text>
  <line x1="52" y1="108" x2="252" y2="108" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- row 1: fence = prevent -->
  <rect x="52" y="120" width="120" height="9" rx="4" fill="#cbd5e1"/>
  <circle cx="206" cy="124" r="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="206" y="128" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#15803d">P</text>

  <!-- row 2 -->
  <rect x="52" y="154" width="104" height="9" rx="4" fill="#cbd5e1"/>
  <circle cx="206" cy="158" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="206" y="162" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#b45309">A</text>

  <!-- row 3 -->
  <rect x="52" y="188" width="132" height="9" rx="4" fill="#cbd5e1"/>
  <circle cx="206" cy="192" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="206" y="196" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#b45309">A</text>

  <!-- row 4 -->
  <rect x="52" y="222" width="94" height="9" rx="4" fill="#cbd5e1"/>
  <circle cx="206" cy="226" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="206" y="230" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#b45309">A</text>

  <!-- last tested line -->
  <line x1="52" y1="258" x2="252" y2="258" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="52" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0c4a6e">LAST TRIGGERED</text>
  <rect x="166" y="268" width="86" height="14" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">Blank = counting on it</text>

  <!-- pool scene, right -->
  <rect x="304" y="150" width="264" height="150" rx="8" fill="url(#da-water)" opacity="0.62"/>
  <rect x="304" y="150" width="264" height="150" rx="8" fill="none" stroke="#0369a1" stroke-width="2"/>

  <!-- fence across the top of the pool area -->
  <line x1="304" y1="112" x2="568" y2="112" stroke="#475569" stroke-width="3"/>
  <line x1="312" y1="84" x2="312" y2="146" stroke="#475569" stroke-width="3"/>
  <line x1="352" y1="84" x2="352" y2="146" stroke="#475569" stroke-width="3"/>
  <line x1="392" y1="84" x2="392" y2="146" stroke="#475569" stroke-width="3"/>
  <line x1="472" y1="84" x2="472" y2="146" stroke="#475569" stroke-width="3"/>
  <line x1="512" y1="84" x2="512" y2="146" stroke="#475569" stroke-width="3"/>
  <line x1="552" y1="84" x2="552" y2="146" stroke="#475569" stroke-width="3"/>

  <!-- gate, ajar, with a gate alarm box -->
  <line x1="432" y1="84" x2="426" y2="146" stroke="#b45309" stroke-width="3"/>
  <rect x="414" y="60" width="34" height="22" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <circle cx="431" cy="71" r="5" fill="#fed7aa" stroke="#b45309" stroke-width="1.5"/>
  <!-- flat battery mark on the gate alarm -->
  <line x1="418" y1="82" x2="444" y2="60" stroke="#9a3412" stroke-width="2.5"/>

  <!-- floating surface alarm, silent -->
  <circle cx="358" cy="196" r="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <circle cx="358" cy="196" r="5" fill="#fed7aa"/>
  <line x1="348" y1="206" x2="368" y2="186" stroke="#9a3412" stroke-width="2.5"/>

  <!-- quiet ripples -->
  <path d="M404 206 q14 -7 28 0 q14 7 28 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.85"/>
  <path d="M404 228 q14 -7 28 0 q14 7 28 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.65"/>

  <!-- house with a closed door, far from the pool -->
  <rect x="496" y="216" width="60" height="62" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <path d="M490 216 l36 -26 l36 26 z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="518" y="244" width="18" height="34" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

  <!-- caption -->
  <text x="304" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">Announce, not prevent. And it fails quietly.</text>
</svg>
