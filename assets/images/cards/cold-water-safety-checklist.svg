<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Cold water safety checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- distant hills -->
  <path d="M0 210 Q120 168 260 200 T600 196 L600 260 L0 260 Z" fill="#c7d2e8"/>
  <path d="M0 224 Q160 190 320 214 T600 214 L600 260 L0 260 Z" fill="#aebfd8"/>
  <!-- cold open water -->
  <rect x="0" y="250" width="600" height="110" fill="url(#water)"/>
  <!-- ripples -->
  <path d="M40 286 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M60 312 q30 -10 60 0 t60 0 t60 0 t60 0" fill="none" stroke="#bfdbfe" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- dock -->
  <rect x="30" y="252" width="150" height="14" rx="3" fill="#a16207"/>
  <rect x="30" y="252" width="150" height="5" rx="2" fill="#ca8a04"/>
  <rect x="52" y="266" width="10" height="40" fill="#78350f"/>
  <rect x="150" y="266" width="10" height="46" fill="#78350f"/>
  <!-- life ring floating -->
  <g transform="translate(250,286)">
    <circle cx="0" cy="0" r="34" fill="#ef4444"/>
    <circle cx="0" cy="0" r="16" fill="url(#water)"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-4" y="-36" width="8" height="12" rx="3" fill="#f8fafc"/>
    <rect x="-4" y="24" width="8" height="12" rx="3" fill="#f8fafc"/>
    <rect x="-36" y="-4" width="12" height="8" rx="3" fill="#f8fafc"/>
    <rect x="24" y="-4" width="12" height="8" rx="3" fill="#f8fafc"/>
  </g>
  <!-- snow/cold flakes -->
  <g fill="#e0f2fe" opacity="0.9">
    <circle cx="120" cy="70" r="4"/>
    <circle cx="180" cy="110" r="3"/>
    <circle cx="90" cy="130" r="3"/>
    <circle cx="230" cy="60" r="3"/>
  </g>
  <!-- thermometer + checklist badge -->
  <g transform="translate(392,150)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- thermometer (cold: blue, low) -->
    <rect x="34" y="26" width="14" height="70" rx="7" fill="#e2e8f0"/>
    <rect x="34" y="78" width="14" height="18" rx="7" fill="#2563eb"/>
    <circle cx="41" cy="104" r="16" fill="#2563eb"/>
    <line x1="54" y1="40" x2="66" y2="40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="58" x2="66" y2="58" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="76" x2="66" y2="76" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- checklist lines -->
    <g transform="translate(80,30)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <path d="M4 9 l4 4 l7 -9" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="4" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="30" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <path d="M4 39 l4 4 l7 -9" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="34" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="60" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <path d="M4 69 l4 4 l7 -9" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="64" width="34" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>
  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#1e3a8a"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Cold Water Safety Checklist for Families</text>
</svg>
