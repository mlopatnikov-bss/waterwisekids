<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>
  <!-- new house -->
  <rect x="20" y="86" width="70" height="46" fill="white" opacity="0.95"/>
  <path d="M14 86 L55 58 L96 86 Z" fill="white"/>
  <rect x="34" y="100" width="16" height="32" fill="#0369a1"/>
  <rect x="60" y="100" width="18" height="16" fill="#7dd3fc"/>
  <!-- pool with fence -->
  <rect x="104" y="120" width="150" height="34" rx="6" fill="#0369a1"/>
  <path d="M104 132 Q130 126 156 132 T208 132 T254 132" stroke="rgba(255,255,255,0.4)" fill="none" stroke-width="2"/>
  <!-- fence posts -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="112" y1="104" x2="112" y2="122"/>
    <line x1="132" y1="104" x2="132" y2="122"/>
    <line x1="152" y1="104" x2="152" y2="122"/>
    <line x1="172" y1="104" x2="172" y2="122"/>
    <line x1="192" y1="104" x2="192" y2="122"/>
    <line x1="104" y1="110" x2="200" y2="110"/>
  </g>
  <!-- checklist card -->
  <rect x="212" y="44" width="72" height="92" rx="8" fill="white"/>
  <rect x="212" y="44" width="72" height="22" rx="8" fill="#0369a1"/>
  <rect x="212" y="58" width="72" height="8" fill="#0369a1"/>
  <text x="248" y="60" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">NEW POOL</text>
  <g>
    <rect x="220" y="76" width="10" height="10" rx="2" fill="none" stroke="#0284c7" stroke-width="2"/>
    <path d="M222 81 l2.5 2.5 l4 -5" stroke="#14b8a6" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="236" y="79" width="40" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="220" y="94" width="10" height="10" rx="2" fill="none" stroke="#0284c7" stroke-width="2"/>
    <path d="M222 99 l2.5 2.5 l4 -5" stroke="#14b8a6" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="236" y="97" width="40" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="220" y="112" width="10" height="10" rx="2" fill="none" stroke="#0284c7" stroke-width="2"/>
    <rect x="236" y="115" width="40" height="4" rx="2" fill="#cbd5e1"/>
  </g>
  <text x="16" y="32" fill="white" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">New Pool?</text>
  <text x="16" y="52" fill="white" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Start Safe.</text>
</svg>
