<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Sun-safe swim day: a bright sun over pool water with a sun hat, sunscreen bottle, and water bottle on the deck">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>
  <!-- sky -->
  <rect width="300" height="180" fill="url(#sky)"/>
  <!-- sun with rays -->
  <g transform="translate(232,44)">
    <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-28"/>
      <line x1="0" y1="28" x2="0" y2="40"/>
      <line x1="-40" y1="0" x2="-28" y2="0"/>
      <line x1="28" y1="0" x2="40" y2="0"/>
      <line x1="-28" y1="-28" x2="-20" y2="-20"/>
      <line x1="20" y1="20" x2="28" y2="28"/>
      <line x1="-28" y1="28" x2="-20" y2="20"/>
      <line x1="20" y1="-20" x2="28" y2="-28"/>
    </g>
    <circle r="24" fill="url(#sun)"/>
  </g>
  <!-- pool deck -->
  <rect y="112" width="300" height="10" fill="#e2e8f0"/>
  <rect y="112" width="300" height="3" fill="#cbd5e1"/>
  <!-- pool water -->
  <rect y="122" width="300" height="58" fill="url(#water)"/>
  <path d="M0 136 Q25 130 50 136 T100 136 T150 136 T200 136 T250 136 T300 136" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <path d="M0 152 Q25 146 50 152 T100 152 T150 152 T200 152 T250 152 T300 152" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.5"/>
  <!-- sun hat on deck -->
  <g transform="translate(60,96)">
    <ellipse cx="0" cy="8" rx="34" ry="9" fill="#fcd34d"/>
    <path d="M-18 8 Q0 -18 18 8 Z" fill="#fbbf24"/>
    <path d="M-18 8 Q0 0 18 8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <!-- sunscreen bottle -->
  <g transform="translate(118,74)">
    <rect x="-9" y="0" width="18" height="34" rx="5" fill="#f97316"/>
    <rect x="-5" y="-8" width="10" height="10" rx="2" fill="#ea580c"/>
    <rect x="-7" y="10" width="14" height="16" rx="2" fill="#fff7ed"/>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ea580c" text-anchor="middle">30</text>
  </g>
  <!-- water bottle -->
  <g transform="translate(160,72)">
    <rect x="-8" y="4" width="16" height="32" rx="6" fill="#7dd3fc" opacity="0.9"/>
    <rect x="-8" y="16" width="16" height="20" rx="4" fill="#38bdf8" opacity="0.85"/>
    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#0284c7"/>
  </g>
</svg>
