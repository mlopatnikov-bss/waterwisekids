<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Switching swim schools: an arrow moving a young swimmer from a small cold outdoor pool to a warm indoor lesson pool marked with a checkmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>
  <!-- LEFT: small seasonal/outdoor pool -->
  <rect x="18" y="96" width="86" height="52" rx="8" fill="url(#cold)" stroke="#3b82f6" stroke-width="2"/>
  <path d="M26 112 Q38 106 50 112 T74 112 T98 112" stroke="#dbeafe" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M26 126 Q38 120 50 126 T74 126 T98 126" stroke="#eff6ff" stroke-width="2" fill="none" opacity="0.7"/>
  <text x="61" y="166" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Current</text>
  <!-- snowflake to hint seasonal/cold break -->
  <g stroke="#93c5fd" stroke-width="1.6" opacity="0.9">
    <line x1="61" y1="74" x2="61" y2="90"/><line x1="53" y1="82" x2="69" y2="82"/>
    <line x1="55.5" y1="76.5" x2="66.5" y2="87.5"/><line x1="66.5" y1="76.5" x2="55.5" y2="87.5"/>
  </g>
  <!-- ARROW -->
  <g>
    <path d="M112 116 H176" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <path d="M172 104 L190 116 L172 128 Z" fill="#f59e0b"/>
  </g>
  <!-- RIGHT: warm indoor lesson pool building -->
  <rect x="196" y="60" width="90" height="88" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <rect x="196" y="60" width="90" height="22" rx="8" fill="#0369a1"/>
  <text x="241" y="76" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">SWIM SCHOOL</text>
  <rect x="206" y="96" width="70" height="42" rx="6" fill="url(#warm)"/>
  <path d="M212 110 Q224 104 236 110 T260 110 T272 110" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M212 124 Q224 118 236 124 T260 124 T272 124" stroke="#e0f2fe" stroke-width="2" fill="none" opacity="0.75"/>
  <!-- swimmer head -->
  <circle cx="241" cy="114" r="6" fill="#fbbf24" stroke="#0c4a6e" stroke-width="1.5"/>
  <!-- checkmark badge -->
  <circle cx="276" cy="66" r="14" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <path d="M269 66 l5 5 l9 -10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="241" y="166" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">Warm &#183; Year-Round</text>
</svg>
