<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Swim goggles, a swim cap and a bright swimsuit laid out on a table beside a fit-check sheet with pass marks">
  <defs>
    <linearGradient id="gear-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="gear-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#gear-bg)"/>

  <!-- table surface -->
  <rect x="0" y="252" width="600" height="108" fill="url(#gear-table)" opacity="0.5"/>
  <path d="M0 252 h600" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>

  <!-- fit-check sheet -->
  <g transform="translate(38,32)">
    <rect x="0" y="0" width="206" height="212" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0c4a6e">GEAR FIT CHECK</text>
    <line x1="18" y1="40" x2="188" y2="40" stroke="#e2e8f0" stroke-width="2"/>

    <!-- row 1: pass -->
    <rect x="18" y="56" width="18" height="18" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M22 65 l4 5 l8 -10" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="48" y1="60" x2="186" y2="60"/>
      <line x1="48" y1="72" x2="150" y2="72"/>
    </g>

    <!-- row 2: pass -->
    <rect x="18" y="102" width="18" height="18" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M22 111 l4 5 l8 -10" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="48" y1="106" x2="186" y2="106"/>
      <line x1="48" y1="118" x2="138" y2="118"/>
    </g>

    <!-- row 3: replace -->
    <rect x="18" y="148" width="18" height="18" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <path d="M23 153 l8 8 M31 153 l-8 8" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="48" y1="152" x2="186" y2="152"/>
      <line x1="48" y1="164" x2="128" y2="164"/>
    </g>

    <!-- row 4: fill-in line -->
    <text x="18" y="200" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">REPLACE BY:</text>
    <line x1="104" y1="196" x2="186" y2="196" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- goggles -->
  <g transform="translate(286,74)">
    <path d="M4 26 C4 8 40 8 40 26 C40 42 4 42 4 26 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="4"/>
    <path d="M60 26 C60 8 96 8 96 26 C96 42 60 42 60 26 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="4"/>
    <path d="M40 26 h20" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
    <path d="M4 22 C-22 14 -30 40 -6 50" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M96 22 C122 14 130 40 106 50" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- swim cap -->
  <g transform="translate(300,150)">
    <path d="M0 46 C0 12 76 12 76 46 Z" fill="#22c55e" stroke="#15803d" stroke-width="4"/>
    <path d="M0 46 h76" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 30 C26 22 34 22 42 28" fill="none" stroke="#dcfce7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- bright swimsuit -->
  <g transform="translate(412,150)">
    <path d="M22 6 h44 l10 22 l-16 8 l-4 -10 v52 h-24 v-52 l-4 10 l-16 -8 Z" fill="#ec4899" stroke="#9d174d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M34 22 h20" stroke="#fce7f3" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- measuring tape hint -->
  <g transform="translate(276,246)">
    <path d="M0 14 C40 -8 100 34 152 10" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <text x="300" y="330" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="middle">Does it still fit? Test before lesson day.</text>
</svg>
