<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Fishing water safety checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="500" cy="70" r="30" fill="#fde68a"/>
  <!-- distant tree line -->
  <path d="M0 196 Q120 158 260 190 T600 186 L600 250 L0 250 Z" fill="#bbf7d0"/>
  <path d="M0 212 Q160 184 320 206 T600 206 L600 250 L0 250 Z" fill="#86efac"/>
  <!-- lake water -->
  <rect x="0" y="244" width="600" height="116" fill="url(#water)"/>
  <!-- ripples -->
  <path d="M40 288 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <path d="M70 314 q30 -10 60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- dock -->
  <rect x="24" y="250" width="150" height="14" rx="3" fill="#a16207"/>
  <rect x="24" y="250" width="150" height="5" rx="2" fill="#ca8a04"/>
  <rect x="46" y="264" width="10" height="42" fill="#78350f"/>
  <rect x="146" y="264" width="10" height="48" fill="#78350f"/>
  <!-- child angler on dock with life jacket -->
  <g transform="translate(96,206)">
    <!-- fishing rod -->
    <line x1="18" y1="-6" x2="120" y2="44" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="44" x2="128" y2="86" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- head -->
    <circle cx="0" cy="-6" r="12" fill="#fcd9b6"/>
    <!-- cap -->
    <path d="M-13 -10 q13 -14 26 0 Z" fill="#ef4444"/>
    <rect x="-13" y="-11" width="20" height="4" rx="2" fill="#dc2626"/>
    <!-- life jacket / torso -->
    <rect x="-14" y="8" width="28" height="34" rx="8" fill="#f97316"/>
    <rect x="-14" y="20" width="28" height="6" fill="#fdba74"/>
    <rect x="-4" y="8" width="8" height="34" fill="#fb923c"/>
    <!-- arms -->
    <rect x="10" y="12" width="16" height="6" rx="3" fill="#fcd9b6" transform="rotate(28 10 12)"/>
    <!-- legs -->
    <rect x="-10" y="42" width="7" height="16" rx="3" fill="#1e40af"/>
    <rect x="3" y="42" width="7" height="16" rx="3" fill="#1e40af"/>
  </g>
  <!-- bobber floating on water -->
  <g transform="translate(224,292)">
    <circle cx="0" cy="0" r="9" fill="#ef4444"/>
    <path d="M-9 0 a9 9 0 0 0 18 0 Z" fill="#f8fafc"/>
    <line x1="0" y1="-9" x2="0" y2="-18" stroke="#334155" stroke-width="2"/>
  </g>
  <!-- checklist badge -->
  <g transform="translate(392,150)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- clipboard -->
    <rect x="22" y="18" width="52" height="66" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
    <rect x="38" y="12" width="20" height="10" rx="3" fill="#0369a1"/>
    <line x1="30" y1="34" x2="66" y2="34" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="48" x2="66" y2="48" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="62" x2="58" y2="62" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <!-- checklist ticks -->
    <g transform="translate(84,26)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 9 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="4" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="30" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 39 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="34" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="60" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 69 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="64" width="34" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>
  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#0369a1"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Fishing Water Safety Checklist for Kids</text>
</svg>
