<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A lake dock at dusk with a shore power pedestal and a boat plugged in, the water beneath it marked with a warning symbol, beside a card listing the four questions that score water for electric shock drowning">
  <defs>
    <linearGradient id="esd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="esd-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#esd-sky)"/>

  <!-- distant shoreline -->
  <path d="M0 150 L70 138 L140 148 L215 134 L300 146 L370 136 L450 147 L520 139 L600 149 L600 168 L0 168 Z" fill="#94a3b8" opacity="0.45"/>

  <!-- water -->
  <rect x="0" y="168" width="600" height="192" fill="url(#esd-water)"/>
  <path d="M0 196 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.5"/>
  <path d="M0 232 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.35"/>

  <!-- dock -->
  <rect x="40" y="176" width="250" height="16" rx="3" fill="#b45309"/>
  <rect x="40" y="176" width="250" height="5" rx="2" fill="#d97706"/>
  <rect x="62" y="192" width="12" height="74" fill="#92400e"/>
  <rect x="150" y="192" width="12" height="74" fill="#92400e"/>
  <rect x="242" y="192" width="12" height="74" fill="#92400e"/>

  <!-- ladder -->
  <rect x="268" y="192" width="5" height="58" fill="#cbd5e1"/>
  <rect x="286" y="192" width="5" height="58" fill="#cbd5e1"/>
  <rect x="268" y="208" width="23" height="4" fill="#cbd5e1"/>
  <rect x="268" y="226" width="23" height="4" fill="#cbd5e1"/>

  <!-- shore power pedestal -->
  <rect x="86" y="126" width="26" height="50" rx="4" fill="#475569"/>
  <rect x="90" y="132" width="18" height="12" rx="2" fill="#fbbf24"/>
  <circle cx="95" cy="156" r="3.4" fill="#e2e8f0"/>
  <circle cx="104" cy="156" r="3.4" fill="#e2e8f0"/>
  <!-- shore power cord to boat -->
  <path d="M112 152 q52 26 86 6" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>

  <!-- boat -->
  <path d="M188 150 h74 l-10 24 h-54 z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="206" y="130" width="34" height="22" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <!-- energised water halo -->
  <ellipse cx="196" cy="252" rx="112" ry="46" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.85" stroke-dasharray="9 7"/>
  <ellipse cx="196" cy="252" rx="72" ry="29" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.6" stroke-dasharray="7 6"/>

  <!-- hazard bolt in the water -->
  <path d="M200 226 l-19 32 h15 l-8 30 27 -38 h-15 z" fill="#fbbf24" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>

  <!-- no-swimming marker -->
  <circle cx="86" cy="286" r="21" fill="#ffffff" opacity="0.92" stroke="#b91c1c" stroke-width="5"/>
  <path d="M71 271 L101 301" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 289 q6 -5 12 0 t12 0" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>

  <!-- question card -->
  <rect x="330" y="46" width="238" height="268" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="3"/>
  <rect x="330" y="46" width="238" height="40" rx="12" fill="#0369a1"/>
  <rect x="330" y="74" width="238" height="12" fill="#0369a1"/>
  <text x="449" y="72" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Score This Water</text>

  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#1f2937">
    <rect x="348" y="104" width="15" height="15" rx="3" fill="#ffffff" stroke="#0369a1" stroke-width="2.5"/>
    <text x="375" y="116">AC power in reach?</text>
    <rect x="348" y="148" width="15" height="15" rx="3" fill="#ffffff" stroke="#0369a1" stroke-width="2.5"/>
    <text x="375" y="160">Fresh water?</text>
    <rect x="348" y="192" width="15" height="15" rx="3" fill="#ffffff" stroke="#0369a1" stroke-width="2.5"/>
    <text x="375" y="204">Protection tested?</text>
    <rect x="348" y="236" width="15" height="15" rx="3" fill="#ffffff" stroke="#0369a1" stroke-width="2.5"/>
    <text x="375" y="248">Tingle rule known?</text>
  </g>

  <rect x="348" y="272" width="202" height="30" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
  <text x="449" y="291" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Power off first. Throw, never go.</text>
</svg>
