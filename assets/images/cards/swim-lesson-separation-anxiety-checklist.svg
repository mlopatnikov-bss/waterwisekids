<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Tear-free swim lesson drop-off checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- indoor pool water -->
  <rect x="0" y="248" width="600" height="112" fill="url(#water)"/>
  <!-- lane line -->
  <path d="M0 298 h600" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="14 10" opacity="0.7"/>
  <!-- ripples -->
  <path d="M40 280 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M70 330 q30 -10 60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- parent kneeling at pool edge giving a calm goodbye wave -->
  <g transform="translate(120,150)">
    <!-- parent body -->
    <rect x="-6" y="30" width="34" height="66" rx="16" fill="#0e7490"/>
    <!-- parent head -->
    <circle cx="11" cy="16" r="17" fill="#fcd9b6"/>
    <path d="M-4 12 a15 15 0 0 1 30 0 q-8 -8 -15 -8 q-7 0 -15 8 z" fill="#5b3a1a"/>
    <!-- waving arm -->
    <rect x="24" y="34" width="30" height="9" rx="4.5" fill="#fcd9b6" transform="rotate(-28 24 38)"/>
  </g>

  <!-- small child at the edge, a little unsure, one tear -->
  <g transform="translate(196,196)">
    <!-- child body -->
    <rect x="-2" y="20" width="24" height="42" rx="11" fill="#f472b6"/>
    <!-- child head -->
    <circle cx="10" cy="10" r="13" fill="#fcd9b6"/>
    <path d="M-1 6 a13 13 0 0 1 22 0 q-6 -7 -11 -7 q-5 0 -11 7 z" fill="#7c3f0e"/>
    <!-- single tear -->
    <path d="M4 14 q-2 5 0 8 q3 -3 0 -8 z" fill="#38bdf8"/>
    <!-- reaching little arm -->
    <rect x="-10" y="24" width="16" height="7" rx="3.5" fill="#fcd9b6" transform="rotate(18 -10 27)"/>
  </g>

  <!-- friendly instructor already in the water, arms open -->
  <g transform="translate(300,244)">
    <ellipse cx="10" cy="20" rx="42" ry="10" fill="#0ea5e9" opacity="0.35"/>
    <circle cx="10" cy="2" r="15" fill="#fcd9b6"/>
    <path d="M-3 -2 a13 13 0 0 1 26 0 q-6 -7 -13 -7 q-7 0 -13 7 z" fill="#1f2937"/>
    <rect x="-2" y="14" width="24" height="18" rx="10" fill="#f59e0b"/>
    <!-- welcoming arms -->
    <rect x="-24" y="14" width="26" height="8" rx="4" fill="#fcd9b6" transform="rotate(22 -24 18)"/>
    <rect x="20" y="14" width="26" height="8" rx="4" fill="#fcd9b6" transform="rotate(-22 46 18)"/>
    <!-- small heart -->
    <path d="M10 -30 q6 -8 12 0 q-6 8 -12 12 q-6 -4 -12 -12 q6 -8 12 0 z" fill="#f87171" opacity="0.9"/>
  </g>

  <!-- calm-goodbye checklist badge -->
  <g transform="translate(410,54)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- speech/goodbye bubble -->
    <g transform="translate(22,22)">
      <rect x="0" y="0" width="48" height="34" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <path d="M12 34 l0 12 l14 -12 z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="24" y="23" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#0284c7" text-anchor="middle">Bye!</text>
    </g>
    <!-- checklist lines -->
    <g transform="translate(80,26)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 9 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="4" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="30" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 39 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="34" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="60" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 69 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="64" width="34" height="10" rx="5" fill="#cbd5e1"/>
    </g>
    <!-- little heart at badge bottom -->
    <path d="M40 118 q10 -14 20 0 q-10 12 -20 20 q-10 -8 -20 -20 q10 -14 20 0 z" fill="#fca5a5" opacity="0.55" transform="translate(35,4) scale(0.7)"/>
  </g>

  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#075985"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Tear-Free Swim Lesson Drop-Off Checklist</text>
</svg>
