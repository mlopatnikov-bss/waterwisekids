<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A swim lesson provider comparison worksheet on a clipboard beside three small building icons for a community center, a city pool and a swim school, at the edge of a pool">
  <defs>
    <linearGradient id="prov-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="prov-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#prov-bg)"/>

  <!-- pool water band -->
  <rect x="0" y="268" width="600" height="92" fill="url(#prov-water)" opacity="0.55"/>
  <path d="M0 274 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#0369a1" stroke-width="3" opacity="0.45"/>

  <!-- clipboard -->
  <rect x="46" y="52" width="236" height="252" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="126" y="38" width="76" height="26" rx="7" fill="#0369a1"/>
  <text x="70" y="98" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">Provider Type</text>
  <line x1="70" y1="112" x2="258" y2="112" stroke="#bae6fd" stroke-width="3"/>

  <!-- three-column compare grid -->
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="70" y1="134" x2="258" y2="134"/>
    <line x1="70" y1="166" x2="258" y2="166"/>
    <line x1="70" y1="198" x2="258" y2="198"/>
    <line x1="70" y1="230" x2="258" y2="230"/>
    <line x1="70" y1="262" x2="258" y2="262"/>
    <line x1="164" y1="126" x2="164" y2="278"/>
    <line x1="211" y1="126" x2="211" y2="278"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">
    <text x="76" y="128">Season</text>
    <text x="76" y="160">Water temp</text>
    <text x="76" y="192">Waitlist</text>
    <text x="76" y="224">Make-ups</text>
    <text x="76" y="256">Annual cost</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">
    <text x="188" y="128">A</text>
    <text x="235" y="128">B</text>
  </g>
  <g fill="#0284c7" opacity="0.75">
    <rect x="172" y="150" width="32" height="8" rx="4"/>
    <rect x="219" y="150" width="32" height="8" rx="4"/>
    <rect x="172" y="182" width="32" height="8" rx="4"/>
    <rect x="219" y="182" width="32" height="8" rx="4"/>
    <rect x="172" y="214" width="32" height="8" rx="4"/>
    <rect x="219" y="214" width="32" height="8" rx="4"/>
    <rect x="172" y="246" width="32" height="8" rx="4"/>
    <rect x="219" y="246" width="32" height="8" rx="4"/>
  </g>

  <!-- three provider buildings -->
  <!-- community center -->
  <g>
    <rect x="322" y="176" width="74" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <path d="M318 176 L359 146 L400 176 Z" fill="#0369a1"/>
    <rect x="342" y="208" width="34" height="44" fill="#bae6fd"/>
    <text x="359" y="270" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle" font-weight="600">Community</text>
  </g>
  <!-- city pool -->
  <g>
    <rect x="414" y="196" width="70" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <rect x="414" y="186" width="70" height="12" rx="4" fill="#0284c7"/>
    <path d="M424 226 q11 -8 22 0 t22 0" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <text x="449" y="270" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle" font-weight="600">City pool</text>
  </g>
  <!-- swim school -->
  <g>
    <rect x="502" y="166" width="72" height="86" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <rect x="502" y="156" width="72" height="14" rx="5" fill="#0c4a6e"/>
    <circle cx="538" cy="200" r="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M514 232 h48" stroke="#bae6fd" stroke-width="6" stroke-linecap="round"/>
    <text x="538" y="270" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle" font-weight="600">Swim school</text>
  </g>

  <!-- calendar badge -->
  <g>
    <rect x="430" y="60" width="118" height="76" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <rect x="430" y="60" width="118" height="22" rx="10" fill="#0369a1"/>
    <text x="489" y="77" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">All year?</text>
    <g fill="#bae6fd">
      <rect x="442" y="92" width="18" height="14" rx="3"/>
      <rect x="466" y="92" width="18" height="14" rx="3"/>
      <rect x="490" y="92" width="18" height="14" rx="3"/>
      <rect x="514" y="92" width="18" height="14" rx="3"/>
      <rect x="442" y="112" width="18" height="14" rx="3"/>
      <rect x="466" y="112" width="18" height="14" rx="3"/>
    </g>
    <rect x="490" y="112" width="18" height="14" rx="3" fill="#0284c7"/>
    <rect x="514" y="112" width="18" height="14" rx="3" fill="#0284c7"/>
  </g>
</svg>
