<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Three swim school credential badges on a wall beside a decoder sheet that translates each claim into a question">
  <defs>
    <linearGradient id="cred-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cred-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#cred-bg)"/>

  <!-- desk surface -->
  <rect x="0" y="252" width="600" height="108" fill="url(#cred-desk)" opacity="0.5"/>
  <path d="M0 252 h600" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>

  <!-- lobby wall with three badges -->
  <g transform="translate(40,34)">
    <rect x="0" y="0" width="212" height="206" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0c4a6e">OUR CREDENTIALS</text>
    <line x1="18" y1="40" x2="194" y2="40" stroke="#e2e8f0" stroke-width="2"/>

    <!-- badge 1 -->
    <circle cx="46" cy="76" r="21" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M38 76 l6 6 l12 -13" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="78" y1="70" x2="192" y2="70"/>
      <line x1="78" y1="83" x2="160" y2="83"/>
    </g>

    <!-- badge 2 -->
    <circle cx="46" cy="130" r="21" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <path d="M46 118 l4 8 l9 1 l-6.5 6 l1.5 9 l-8 -4.5 l-8 4.5 l1.5 -9 l-6.5 -6 l9 -1 z" fill="#b45309"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="78" y1="124" x2="192" y2="124"/>
      <line x1="78" y1="137" x2="150" y2="137"/>
    </g>

    <!-- badge 3 -->
    <circle cx="46" cy="184" r="21" fill="#ede9fe" stroke="#5b21b6" stroke-width="3"/>
    <path d="M46 172 v24 M34 184 h24" stroke="#5b21b6" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="78" y1="178" x2="192" y2="178"/>
      <line x1="78" y1="191" x2="168" y2="191"/>
    </g>
  </g>

  <!-- decoder sheet -->
  <g transform="translate(300,52) rotate(3)">
    <rect x="0" y="0" width="252" height="222" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <rect x="0" y="0" width="252" height="34" rx="8" fill="#0369a1"/>
    <rect x="0" y="24" width="252" height="10" fill="#0369a1"/>
    <text x="16" y="23" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff">CLAIM &#8594; WHAT IT PROVES &#8594; ASK</text>

    <!-- three decoder rows -->
    <g font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0c4a6e">
      <text x="16" y="60">&#8220;Red Cross certified&#8221;</text>
      <text x="16" y="118">&#8220;Copyrighted curriculum&#8221;</text>
      <text x="16" y="176">&#8220;Accredited school&#8221;</text>
    </g>
    <g stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round">
      <line x1="16" y1="72" x2="150" y2="72"/>
      <line x1="16" y1="84" x2="176" y2="84"/>
      <line x1="16" y1="130" x2="164" y2="130"/>
      <line x1="16" y1="142" x2="140" y2="142"/>
      <line x1="16" y1="188" x2="170" y2="188"/>
      <line x1="16" y1="200" x2="132" y2="200"/>
    </g>
    <!-- question marks marking the ask column -->
    <g font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0369a1">
      <text x="204" y="80">?</text>
      <text x="204" y="138">?</text>
      <text x="204" y="196">?</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="192" y1="44" x2="192" y2="206"/>
      <line x1="16" y1="98" x2="236" y2="98"/>
      <line x1="16" y1="156" x2="236" y2="156"/>
    </g>
  </g>

  <!-- magnifying glass over the decoder -->
  <g transform="translate(430,196)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" fill-opacity="0.35" stroke="#0c4a6e" stroke-width="7"/>
    <line x1="30" y1="30" x2="62" y2="62" stroke="#0c4a6e" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
