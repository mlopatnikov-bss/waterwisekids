<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A weekly swim instructor log on a clipboard beside four different instructor name badges at the pool edge">
  <defs>
    <linearGradient id="cont-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cont-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#cont-bg)"/>

  <!-- pool water band -->
  <rect x="0" y="268" width="600" height="92" fill="url(#cont-water)" opacity="0.55"/>
  <path d="M0 274 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#0369a1" stroke-width="3" opacity="0.45"/>

  <!-- clipboard with the weekly instructor log -->
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="214" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="74" y="-9" width="66" height="20" rx="6" fill="#94a3b8"/>
    <text x="20" y="36" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#0c4a6e">INSTRUCTOR LOG</text>
    <line x1="20" y1="46" x2="194" y2="46" stroke="#e2e8f0" stroke-width="2"/>

    <!-- column heads -->
    <text x="20" y="62" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569">WEEK</text>
    <text x="70" y="62" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569">WHO TAUGHT</text>
    <text x="160" y="62" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569">SAME?</text>

    <!-- week 1 -->
    <text x="20" y="84" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">1</text>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round"><line x1="70" y1="82" x2="140" y2="82"/></g>
    <rect x="162" y="72" width="17" height="17" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M166 81 l4 5 l8 -10" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- week 2 -->
    <text x="20" y="116" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">2</text>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round"><line x1="70" y1="114" x2="132" y2="114"/></g>
    <rect x="162" y="104" width="17" height="17" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M166 113 l4 5 l8 -10" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- week 3 - changed -->
    <text x="20" y="148" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">3</text>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round"><line x1="70" y1="146" x2="145" y2="146"/></g>
    <rect x="162" y="136" width="17" height="17" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/>
    <path d="M166 140 l9 9 M175 140 l-9 9" fill="none" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/>

    <!-- verdict row -->
    <rect x="20" y="176" width="174" height="22" rx="5" fill="#fff7ed" stroke="#9a3412" stroke-width="2.5"/>
    <text x="30" y="191" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#7c2d12">4 TEACHERS, 12 WEEKS</text>
  </g>

  <!-- four different instructor name badges -->
  <g transform="translate(292,96)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="86" height="60" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
      <circle cx="20" cy="24" r="10" fill="#38bdf8" stroke="#0369a1" stroke-width="2.5"/>
      <path d="M8 48 a12 12 0 0 1 24 0" fill="#38bdf8" stroke="#0369a1" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="42" y1="20" x2="74" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <line x1="42" y1="34" x2="66" y2="34" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(102,0)">
      <rect x="0" y="0" width="86" height="60" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
      <circle cx="20" cy="24" r="10" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
      <path d="M8 48 a12 12 0 0 1 24 0" fill="#fbbf24" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="42" y1="20" x2="70" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <line x1="42" y1="34" x2="74" y2="34" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(0,76)">
      <rect x="0" y="0" width="86" height="60" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
      <circle cx="20" cy="24" r="10" fill="#fdba74" stroke="#b45309" stroke-width="2.5"/>
      <path d="M8 48 a12 12 0 0 1 24 0" fill="#fdba74" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="42" y1="20" x2="66" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <line x1="42" y1="34" x2="74" y2="34" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(102,76)">
      <rect x="0" y="0" width="86" height="60" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
      <circle cx="20" cy="24" r="10" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
      <path d="M8 48 a12 12 0 0 1 24 0" fill="#f59e0b" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="42" y1="20" x2="74" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <line x1="42" y1="34" x2="62" y2="34" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- rotation arrows through the badges -->
    <path d="M94 30 a34 34 0 0 1 0 76" fill="none" stroke="#0c4a6e" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M86 100 l8 12 l10 -9" fill="none" stroke="#0c4a6e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  </g>

  <!-- lane rope -->
  <g transform="translate(0,300)">
    <circle cx="70" cy="0" r="9" fill="#fbbf24" opacity="0.85"/>
    <circle cx="98" cy="0" r="9" fill="#f8fafc" opacity="0.85"/>
    <circle cx="126" cy="0" r="9" fill="#fbbf24" opacity="0.85"/>
    <circle cx="474" cy="0" r="9" fill="#f8fafc" opacity="0.85"/>
    <circle cx="502" cy="0" r="9" fill="#fbbf24" opacity="0.85"/>
    <circle cx="530" cy="0" r="9" fill="#f8fafc" opacity="0.85"/>
  </g>
</svg>
