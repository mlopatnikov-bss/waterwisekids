<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Multi-child water supervision: one adult water watcher tagged with a badge keeping eyes on three children of different swim abilities in a pool">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" fill="url(#sky)"/>
  <!-- pool deck -->
  <rect y="104" width="300" height="12" fill="#e2e8f0"/>
  <rect y="104" width="300" height="3" fill="#cbd5e1"/>
  <!-- water -->
  <rect y="116" width="300" height="64" fill="url(#water)"/>
  <path d="M0 130 Q 25 124 50 130 T 100 130 T 150 130 T 200 130 T 250 130 T 300 130" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.7"/>
  <path d="M0 148 Q 25 142 50 148 T 100 148 T 150 148 T 200 148 T 250 148 T 300 148" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <!-- adult water watcher on deck, left -->
  <g transform="translate(40,60)">
    <circle cx="0" cy="0" r="11" fill="#fcd9b6"/>
    <path d="M-11 -2 A 11 11 0 0 1 11 -2 L 11 -6 A 11 11 0 0 0 -11 -6 Z" fill="#7c3f1d"/>
    <circle cx="-4" cy="1" r="1.6" fill="#1f2937"/>
    <circle cx="4" cy="1" r="1.6" fill="#1f2937"/>
    <rect x="-12" y="12" width="24" height="32" rx="7" fill="#0284c7"/>
    <!-- watcher badge/tag -->
    <rect x="-9" y="19" width="18" height="12" rx="2.5" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>
    <line x1="-6" y1="23" x2="6" y2="23" stroke="#78350f" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-6" y1="27" x2="3" y2="27" stroke="#78350f" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- sight lines from watcher to each child -->
  <g stroke="#f8fafc" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.85" stroke-linecap="round">
    <line x1="55" y1="74" x2="128" y2="112"/>
    <line x1="55" y1="76" x2="192" y2="118"/>
    <line x1="55" y1="78" x2="252" y2="126"/>
  </g>
  <!-- child 1: non-swimmer in life jacket, within arm's reach zone -->
  <g transform="translate(132,116)">
    <circle cx="0" cy="0" r="9" fill="#fcd9b6"/>
    <path d="M-9 -1 A 9 9 0 0 1 9 -1 L 9 -5 A 9 9 0 0 0 -9 -5 Z" fill="#1f2937"/>
    <circle cx="-3.2" cy="1" r="1.3" fill="#1f2937"/>
    <circle cx="3.2" cy="1" r="1.3" fill="#1f2937"/>
    <rect x="-11" y="9" width="22" height="17" rx="5" fill="#f97316"/>
    <line x1="0" y1="9" x2="0" y2="26" stroke="#c2410c" stroke-width="1.5"/>
    <rect x="-11" y="15" width="22" height="3.5" fill="#fdba74"/>
  </g>
  <!-- child 2: developing swimmer at the wall -->
  <g transform="translate(196,122)">
    <circle cx="0" cy="0" r="8.5" fill="#f3c6a0"/>
    <path d="M-8.5 -1 A 8.5 8.5 0 0 1 8.5 -1 L 8.5 -5 A 8.5 8.5 0 0 0 -8.5 -5 Z" fill="#92400e"/>
    <circle cx="-3" cy="1" r="1.2" fill="#1f2937"/>
    <circle cx="3" cy="1" r="1.2" fill="#1f2937"/>
    <rect x="-9" y="9" width="18" height="14" rx="4.5" fill="#22c55e"/>
  </g>
  <!-- child 3: competent swimmer, further out -->
  <g transform="translate(256,130)">
    <circle cx="0" cy="0" r="8" fill="#e8b48a"/>
    <path d="M-8 -1 A 8 8 0 0 1 8 -1 L 8 -4.5 A 8 8 0 0 0 -8 -4.5 Z" fill="#451a03"/>
    <circle cx="-2.8" cy="1" r="1.1" fill="#1f2937"/>
    <circle cx="2.8" cy="1" r="1.1" fill="#1f2937"/>
    <rect x="-8.5" y="8.5" width="17" height="13" rx="4" fill="#a855f7"/>
  </g>
  <!-- headcount tally on deck, right -->
  <g transform="translate(268,64)">
    <rect x="-20" y="-18" width="40" height="34" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <g stroke="#0369a1" stroke-width="2.4" stroke-linecap="round">
      <line x1="-11" y1="-9" x2="-11" y2="1"/>
      <line x1="-5" y1="-9" x2="-5" y2="1"/>
      <line x1="1" y1="-9" x2="1" y2="1"/>
    </g>
    <text x="0" y="12" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" fill="#0c4a6e" text-anchor="middle">COUNT</text>
  </g>
</svg>
