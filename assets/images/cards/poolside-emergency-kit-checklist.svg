<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Poolside emergency and first-aid kit checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- pool water -->
  <rect x="0" y="250" width="600" height="110" fill="url(#water)"/>
  <!-- pool coping edge -->
  <rect x="0" y="242" width="600" height="10" fill="#e2e8f0"/>
  <!-- ripples -->
  <path d="M40 284 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M70 330 q30 -10 60 0 t60 0 t60 0 t60 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- ring buoy (rescue) leaning on deck -->
  <g transform="translate(96,150)">
    <circle cx="0" cy="0" r="52" fill="#ef4444"/>
    <circle cx="0" cy="0" r="26" fill="#f0f9ff"/>
    <!-- white bands -->
    <rect x="-6" y="-54" width="12" height="20" rx="3" fill="#ffffff"/>
    <rect x="-6" y="34" width="12" height="20" rx="3" fill="#ffffff"/>
    <rect x="-54" y="-6" width="20" height="12" rx="3" fill="#ffffff"/>
    <rect x="34" y="-6" width="20" height="12" rx="3" fill="#ffffff"/>
    <!-- rope -->
    <path d="M-46 26 q-20 24 -8 48" fill="none" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/>
  </g>

  <!-- first aid kit box -->
  <g transform="translate(210,150)">
    <rect x="0" y="0" width="150" height="104" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="30" rx="14" fill="#dc2626"/>
    <rect x="0" y="18" width="150" height="14" fill="#dc2626"/>
    <!-- handle -->
    <rect x="58" y="-9" width="34" height="12" rx="6" fill="#b91c1c"/>
    <!-- red cross -->
    <g transform="translate(75,66)">
      <rect x="-9" y="-26" width="18" height="52" rx="4" fill="#dc2626"/>
      <rect x="-26" y="-9" width="52" height="18" rx="4" fill="#dc2626"/>
    </g>
  </g>

  <!-- reaching pole across the top -->
  <rect x="150" y="40" width="330" height="9" rx="4.5" fill="#94a3b8" transform="rotate(-6 150 44)"/>
  <path d="M470 5 q22 4 20 26 q-2 16 -20 14" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round" transform="rotate(-6 470 20)"/>

  <!-- checklist clipboard badge -->
  <g transform="translate(410,120)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- phone icon -->
    <g transform="translate(20,24)">
      <rect x="0" y="0" width="30" height="50" rx="6" fill="#0f172a"/>
      <rect x="4" y="6" width="22" height="34" rx="2" fill="#38bdf8"/>
      <text x="15" y="30" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">911</text>
      <circle cx="15" cy="45" r="2.5" fill="#e2e8f0"/>
    </g>
    <!-- checklist lines -->
    <g transform="translate(70,26)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 9 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="4" width="44" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="30" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 39 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="34" width="44" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="60" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 69 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="64" width="44" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#b91c1c"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Poolside Emergency &amp; First-Aid Kit Checklist</text>
</svg>
