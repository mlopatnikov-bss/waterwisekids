<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Indoor pool safety: an indoor pool building with a roof and windows over blue water, with a green checkmark shield">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="300" height="180" fill="url(#sky)"/>
  <!-- building shell -->
  <rect x="22" y="58" width="200" height="94" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- roof -->
  <path d="M12 60 L122 18 L232 60 Z" fill="url(#roof)"/>
  <path d="M12 60 L232 60 L232 68 L12 68 Z" fill="#0c4a6e" opacity="0.35"/>
  <!-- window wall -->
  <g>
    <rect x="36" y="72" width="40" height="30" rx="3" fill="url(#glass)" stroke="#7dd3fc" stroke-width="1.6"/>
    <rect x="84" y="72" width="40" height="30" rx="3" fill="url(#glass)" stroke="#7dd3fc" stroke-width="1.6"/>
    <rect x="132" y="72" width="40" height="30" rx="3" fill="url(#glass)" stroke="#7dd3fc" stroke-width="1.6"/>
    <rect x="180" y="72" width="28" height="30" rx="3" fill="url(#glass)" stroke="#7dd3fc" stroke-width="1.6"/>
    <path d="M40 100 L72 76 M88 100 L120 76 M136 100 L168 76 M184 100 L206 78" stroke="#ffffff" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  </g>
  <!-- deck -->
  <rect x="30" y="110" width="184" height="10" fill="#e2e8f0"/>
  <!-- indoor pool water -->
  <rect x="36" y="120" width="172" height="28" rx="4" fill="url(#water)"/>
  <path d="M36 126 Q 52 119 68 126 T 100 126 T 132 126 T 164 126 T 196 126 T 212 126 V148 H36 Z" fill="#7dd3fc" opacity="0.5"/>
  <!-- lane line -->
  <path d="M44 138 H200" stroke="#e0f2fe" stroke-width="2.4" stroke-dasharray="8 7" stroke-linecap="round" opacity="0.9"/>
  <!-- lifering on deck -->
  <g transform="translate(206,102)">
    <circle cx="0" cy="0" r="11" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <circle cx="0" cy="0" r="4.6" fill="#f8fafc"/>
    <path d="M-11 0 h5 M11 0 h-5 M0 -11 v5 M0 11 v-5" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- protective shield with checkmark -->
  <g transform="translate(250,112)">
    <path d="M0 -30 L27 -19 V5 C27 23 15 34 0 39 C-15 34 -27 23 -27 5 V-19 Z" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <path d="M-12 3 L-3 13 L14 -9" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
