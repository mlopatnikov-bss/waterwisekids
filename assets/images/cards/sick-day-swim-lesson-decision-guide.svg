<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A sick-day swim decision card held on a fridge door by a magnet, beside a thermometer and a waiting swim bag">
  <defs>
    <linearGradient id="sick-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="sick-fridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sick-bg)"/>

  <!-- fridge door panel -->
  <rect x="24" y="24" width="330" height="312" rx="14" fill="url(#sick-fridge)"/>
  <rect x="24" y="24" width="330" height="312" rx="14" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="332" y="150" width="10" height="70" rx="5" fill="#94a3b8"/>

  <!-- the decision card pinned to the fridge -->
  <g transform="translate(58 52)">
    <rect x="4" y="6" width="256" height="256" rx="8" fill="#0f172a" opacity="0.12"/>
    <rect x="0" y="0" width="256" height="256" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="256" height="40" rx="8" fill="#0369a1"/>
    <rect x="0" y="30" width="256" height="10" fill="#0369a1"/>
    <rect x="18" y="14" width="130" height="8" rx="4" fill="#e0f2fe"/>
    <rect x="18" y="26" width="86" height="5" rx="2.5" fill="#bae6fd"/>

    <g>
      <circle cx="30" cy="66" r="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <path d="M25.5 66 l3.5 3.5 l6 -7" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="61" width="120" height="6" rx="3" fill="#334155"/>
      <rect x="48" y="72" width="82" height="5" rx="2.5" fill="#94a3b8"/>
    </g>
    <g>
      <circle cx="30" cy="104" r="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
      <path d="M26.5 100.5 l7 7 M33.5 100.5 l-7 7" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="48" y="99" width="140" height="6" rx="3" fill="#334155"/>
      <rect x="48" y="110" width="96" height="5" rx="2.5" fill="#94a3b8"/>
    </g>
    <g>
      <circle cx="30" cy="142" r="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
      <path d="M26.5 138.5 l7 7 M33.5 138.5 l-7 7" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="48" y="137" width="112" height="6" rx="3" fill="#334155"/>
      <rect x="48" y="148" width="128" height="5" rx="2.5" fill="#94a3b8"/>
    </g>
    <g>
      <circle cx="30" cy="180" r="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
      <path d="M25.5 180 l3.5 3.5 l6 -7" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="175" width="132" height="6" rx="3" fill="#334155"/>
      <rect x="48" y="186" width="74" height="5" rx="2.5" fill="#94a3b8"/>
    </g>

    <rect x="18" y="214" width="220" height="26" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="30" y="223" width="150" height="6" rx="3" fill="#0369a1" opacity="0.65"/>
  </g>

  <!-- fridge magnet holding the card -->
  <circle cx="186" cy="52" r="13" fill="#c2410c"/>
  <circle cx="186" cy="52" r="6" fill="#fed7aa"/>

  <!-- thermometer -->
  <g transform="translate(410 68)">
    <rect x="14" y="0" width="20" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="24" cy="166" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="24" cy="166" r="14" fill="#b91c1c"/>
    <rect x="19" y="60" width="10" height="106" fill="#b91c1c"/>
    <path d="M38 30 h12 M38 48 h9 M38 66 h12 M38 84 h9 M38 102 h12" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- swim bag, waiting -->
  <g transform="translate(474 208)">
    <path d="M4 26 h84 a10 10 0 0 1 10 10 v56 a10 10 0 0 1 -10 10 h-84 a10 10 0 0 1 -10 -10 v-56 a10 10 0 0 1 10 -10 z" fill="#0ea5e9"/>
    <path d="M28 26 v-8 a18 18 0 0 1 36 0 v8" fill="none" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
    <rect x="-6" y="52" width="100" height="14" fill="#0369a1" opacity="0.55"/>
    <circle cx="46" cy="80" r="9" fill="#e0f2fe"/>
  </g>

  <!-- goggles resting beside the bag -->
  <g transform="translate(392 296)">
    <circle cx="18" cy="14" r="13" fill="none" stroke="#0369a1" stroke-width="5"/>
    <circle cx="52" cy="14" r="13" fill="none" stroke="#0369a1" stroke-width="5"/>
    <path d="M31 14 h8" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
