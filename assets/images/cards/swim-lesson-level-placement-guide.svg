<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Swim lesson level placement guide: four rising steps from a beginner blowing bubbles to an advanced swimmer, each step a deeper shade of blue with a checkmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#7dd3fc"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>

  <!-- rising step bars -->
  <rect x="24"  y="118" width="52" height="40" rx="6" fill="url(#s1)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="88"  y="96"  width="52" height="62" rx="6" fill="url(#s2)" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="152" y="72"  width="52" height="86" rx="6" fill="url(#s3)" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="216" y="46"  width="52" height="112" rx="6" fill="url(#s4)" stroke="#075985" stroke-width="1.5"/>

  <!-- level numbers -->
  <text x="50"  y="150" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#0c4a6e" text-anchor="middle">1</text>
  <text x="114" y="150" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#0c4a6e" text-anchor="middle">2</text>
  <text x="178" y="150" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="242" y="150" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>

  <!-- swimmer figures on each step (simple dots + arms), progressively lower/flatter = more advanced -->
  <!-- step1: head above water, bubbles -->
  <circle cx="50" cy="108" r="6" fill="#f8fafc" stroke="#0c4a6e" stroke-width="1.5"/>
  <circle cx="58" cy="104" r="1.6" fill="#e0f2fe"/><circle cx="61" cy="108" r="1.1" fill="#e0f2fe"/>
  <!-- step2: floating back -->
  <circle cx="114" cy="86" r="6" fill="#f8fafc" stroke="#0c4a6e" stroke-width="1.5"/>
  <path d="M104 90 H126" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <!-- step3: freestyle -->
  <circle cx="178" cy="62" r="6" fill="#f8fafc" stroke="#075985" stroke-width="1.5"/>
  <path d="M170 60 Q178 50 186 60" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- step4: strong swimmer -->
  <circle cx="242" cy="36" r="6" fill="#f8fafc" stroke="#062f4f" stroke-width="1.5"/>
  <path d="M234 34 Q242 24 250 34" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- checkmark badge on top step -->
  <circle cx="262" cy="40" r="10" fill="#22c55e"/>
  <path d="M257 40 l3.5 3.5 L268 36" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title -->
  <text x="150" y="24" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0c4a6e" text-anchor="middle">Find Your Child&#39;s Level</text>
</svg>
