<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Illustration of a five-layer water safety scorecard">
  <defs>
    <linearGradient id="rabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" fill="url(#rabg)"/>

  <!-- water line -->
  <path d="M0 150 Q 25 143 50 150 T 100 150 T 150 150 T 200 150 T 250 150 T 300 150 V180 H0 Z" fill="#0369a1" opacity="0.35"/>

  <!-- scorecard sheet -->
  <rect x="88" y="18" width="124" height="146" rx="9" fill="#ffffff"/>
  <rect x="88" y="18" width="124" height="24" rx="9" fill="#0c4a6e"/>
  <rect x="88" y="34" width="124" height="8" fill="#0c4a6e"/>
  <text x="150" y="35" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SAFETY SCORE</text>

  <!-- five layer rows with score bars -->
  <g font-family="Inter, Arial, sans-serif" font-size="7" fill="#475569">
    <rect x="99" y="53" width="9" height="9" rx="2" fill="#0284c7"/>
    <rect x="113" y="55" width="60" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="113" y="55" width="52" height="5" rx="2.5" fill="#0284c7"/>
    <text x="180" y="60">10</text>

    <rect x="99" y="70" width="9" height="9" rx="2" fill="#0284c7"/>
    <rect x="113" y="72" width="60" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="113" y="72" width="44" height="5" rx="2.5" fill="#0284c7"/>
    <text x="180" y="77">8</text>

    <rect x="99" y="87" width="9" height="9" rx="2" fill="#f59e0b"/>
    <rect x="113" y="89" width="60" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="113" y="89" width="16" height="5" rx="2.5" fill="#f59e0b"/>
    <text x="180" y="94">3</text>

    <rect x="99" y="104" width="9" height="9" rx="2" fill="#0284c7"/>
    <rect x="113" y="106" width="60" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="113" y="106" width="48" height="5" rx="2.5" fill="#0284c7"/>
    <text x="180" y="111">9</text>

    <rect x="99" y="121" width="9" height="9" rx="2" fill="#0284c7"/>
    <rect x="113" y="123" width="60" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="113" y="123" width="40" height="5" rx="2.5" fill="#0284c7"/>
    <text x="180" y="128">7</text>
  </g>

  <!-- total -->
  <line x1="99" y1="138" x2="190" y2="138" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="99" y="152" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#0c4a6e">TOTAL</text>
  <text x="190" y="152" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#0c4a6e" text-anchor="end">37/50</text>

  <!-- pencil -->
  <g transform="rotate(35 232 96)">
    <rect x="226" y="60" width="12" height="60" rx="2" fill="#fbbf24"/>
    <rect x="226" y="60" width="12" height="10" rx="2" fill="#f472b6"/>
    <polygon points="226,120 238,120 232,134" fill="#fde68a"/>
    <polygon points="229,128 235,128 232,134" fill="#334155"/>
  </g>

  <!-- shield accent -->
  <path d="M46 62 L66 54 L86 62 V86 C86 100 76 110 66 114 C56 110 46 100 46 86 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M56 84 L63 91 L77 74" stroke="#0284c7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
