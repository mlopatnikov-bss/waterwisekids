<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A swim school enrollment agreement read through a magnifying glass, beside a checklist of policy questions">
  <defs>
    <linearGradient id="pol-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pol-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#pol-bg)"/>

  <!-- desk surface -->
  <rect x="0" y="248" width="600" height="112" fill="url(#pol-desk)" opacity="0.5"/>
  <path d="M0 248 h600" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>

  <!-- enrollment agreement with fine print -->
  <g transform="translate(48,40) rotate(-4)">
    <rect x="0" y="0" width="212" height="252" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="0" y="0" width="212" height="34" rx="8" fill="#0c4a6e"/>
    <rect x="0" y="24" width="212" height="10" fill="#0c4a6e"/>
    <text x="16" y="23" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">ENROLLMENT AGREEMENT</text>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="16" y1="56" x2="180" y2="56"/>
      <line x1="16" y1="70" x2="196" y2="70"/>
      <line x1="16" y1="84" x2="150" y2="84"/>
    </g>
    <g stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round">
      <line x1="16" y1="108" x2="196" y2="108"/>
      <line x1="16" y1="120" x2="188" y2="120"/>
      <line x1="16" y1="132" x2="196" y2="132"/>
      <line x1="16" y1="144" x2="164" y2="144"/>
      <line x1="16" y1="156" x2="196" y2="156"/>
      <line x1="16" y1="168" x2="176" y2="168"/>
      <line x1="16" y1="180" x2="196" y2="180"/>
      <line x1="16" y1="192" x2="140" y2="192"/>
    </g>
    <line x1="16" y1="222" x2="118" y2="222" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M22 218 q10 -12 20 -1 q8 -12 18 -2 q8 6 18 -4" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="226" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sign here</text>
  </g>

  <!-- magnifying glass over the fine print -->
  <g transform="translate(150,150)">
    <circle cx="0" cy="0" r="52" fill="#ffffff" opacity="0.72"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#0369a1" stroke-width="8"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <g stroke="#0f172a" stroke-width="3.5" stroke-linecap="round">
      <line x1="-28" y1="-16" x2="26" y2="-16"/>
      <line x1="-28" y1="0" x2="18" y2="0"/>
      <line x1="-28" y1="16" x2="28" y2="16"/>
    </g>
    <line x1="37" y1="37" x2="72" y2="72" stroke="#0369a1" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- policy question card -->
  <g transform="translate(316,52)">
    <rect x="0" y="0" width="236" height="228" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="20" y="34" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#0c4a6e">ASK BEFORE YOU ENROLL</text>
    <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">
      <g transform="translate(20,52)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
        <path d="M4 9 l4 5 l7 -9" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="30" y="14">Enrollment model</text>
      </g>
      <g transform="translate(20,82)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
        <path d="M4 9 l4 5 l7 -9" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="30" y="14">Makeups &amp; expiry</text>
      </g>
      <g transform="translate(20,112)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
        <path d="M4 9 l4 5 l7 -9" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="30" y="14">Freeze &amp; hold terms</text>
      </g>
      <g transform="translate(20,142)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
        <text x="30" y="14">Cancellation notice</text>
      </g>
      <g transform="translate(20,172)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
        <text x="30" y="14">Refund or credit?</text>
      </g>
      <g transform="translate(20,202)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
        <text x="30" y="14">Membership tiers</text>
      </g>
    </g>
  </g>

  <!-- pen on the desk -->
  <g transform="translate(300,300) rotate(-8)">
    <rect x="0" y="0" width="132" height="12" rx="6" fill="#1d4ed8"/>
    <path d="M132 0 l22 6 l-22 6 z" fill="#facc15"/>
    <rect x="0" y="0" width="26" height="12" rx="6" fill="#0f172a"/>
  </g>

  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#0c4a6e"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Swim School Policy Fine-Print Checklist</text>
</svg>
