<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Year-round swim skills: a child swimming in water ringed by season icons — sun, leaf, and snowflake — showing lessons continue all year">
  <defs>
    <linearGradient id="yrbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="yrwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="300" height="180" fill="url(#yrbg)"/>
  <!-- pool water lower area -->
  <rect y="118" width="300" height="62" fill="url(#yrwater)"/>
  <!-- water surface highlights -->
  <path d="M0 122 q15 -6 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <path d="M0 132 q15 5 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>

  <!-- circular year arrow (continuity) -->
  <g transform="translate(150,84)">
    <circle r="52" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="255 40" stroke-linecap="round" transform="rotate(20)" opacity="0.85"/>
    <!-- arrowhead -->
    <path d="M40 -33 l10 -6 l-1 12 z" fill="#0284c7" transform="rotate(20)"/>
  </g>

  <!-- season icons around the ring -->
  <!-- sun (summer, top) -->
  <g transform="translate(150,24)">
    <circle r="9" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
    <g stroke="#eab308" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-14" x2="0" y2="-11"/>
      <line x1="0" y1="11" x2="0" y2="14"/>
      <line x1="-14" y1="0" x2="-11" y2="0"/>
      <line x1="11" y1="0" x2="14" y2="0"/>
      <line x1="-10" y1="-10" x2="-8" y2="-8"/>
      <line x1="8" y1="8" x2="10" y2="10"/>
      <line x1="10" y1="-10" x2="8" y2="-8"/>
      <line x1="-8" y1="8" x2="-10" y2="10"/>
    </g>
  </g>
  <!-- autumn leaf (right) -->
  <g transform="translate(214,74)">
    <path d="M0 -11 C7 -6 8 4 0 12 C-8 4 -7 -6 0 -11 Z" fill="#fb923c" stroke="#ea580c" stroke-width="1.2"/>
    <line x1="0" y1="-6" x2="0" y2="10" stroke="#ea580c" stroke-width="1"/>
  </g>
  <!-- snowflake (winter, left) -->
  <g transform="translate(86,74)" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <line x1="-10" y1="-6" x2="10" y2="6"/>
    <line x1="10" y1="-6" x2="-10" y2="6"/>
    <g stroke-width="1.6">
      <line x1="0" y1="-11" x2="-3" y2="-8"/><line x1="0" y1="-11" x2="3" y2="-8"/>
      <line x1="0" y1="11" x2="-3" y2="8"/><line x1="0" y1="11" x2="3" y2="8"/>
    </g>
  </g>

  <!-- child swimming in the water -->
  <g transform="translate(150,120)">
    <!-- arm reaching forward -->
    <path d="M-6 6 q16 -8 30 -2" fill="none" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="-6" cy="10" rx="20" ry="9" fill="#0ea5e9"/>
    <!-- head with swim cap -->
    <circle cx="-26" cy="6" r="8" fill="#fcd9b6"/>
    <path d="M-34 4 a8 8 0 0 1 16 0 z" fill="#f472b6"/>
    <!-- splash -->
    <g fill="#e0f2fe">
      <circle cx="16" cy="4" r="2"/>
      <circle cx="21" cy="8" r="1.5"/>
      <circle cx="13" cy="9" r="1.3"/>
    </g>
  </g>

  <!-- checkmark badge -->
  <g transform="translate(52,150)">
    <circle r="16" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <path d="M-7 0 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
