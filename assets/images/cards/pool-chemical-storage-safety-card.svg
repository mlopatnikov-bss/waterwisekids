<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A locked pool shed shelf with a chlorine tub and an acid jug kept apart on opposite sides, goggles and gloves hanging beside them, next to a safety card listing the four moments an injury happens">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pc-tub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pc-jug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#pc-bg)"/>

  <!-- shed interior, left -->
  <rect x="28" y="44" width="286" height="272" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="28" y="44" width="286" height="38" rx="10" fill="#0369a1"/>
  <rect x="28" y="70" width="286" height="12" fill="#0369a1"/>
  <text x="48" y="69" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">The Shelf</text>

  <!-- padlock on the shed header -->
  <path d="M276 55 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="271" y="55" width="26" height="18" rx="3" fill="#ffffff"/>
  <circle cx="284" cy="63" r="3" fill="#0369a1"/>

  <!-- upper shelf board -->
  <rect x="44" y="176" width="254" height="7" rx="3" fill="#cbd5e1"/>
  <!-- lower shelf board -->
  <rect x="44" y="278" width="254" height="7" rx="3" fill="#cbd5e1"/>

  <!-- chlorine tub, upper LEFT -->
  <rect x="60" y="118" width="62" height="58" rx="5" fill="url(#pc-tub)" stroke="#92400e" stroke-width="2"/>
  <rect x="55" y="110" width="72" height="12" rx="4" fill="#92400e"/>
  <rect x="68" y="136" width="46" height="24" rx="3" fill="#fffbeb"/>
  <text x="91" y="152" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">CL</text>

  <!-- acid jug, upper RIGHT, deliberately far apart -->
  <path d="M232 128 h44 a6 6 0 0 1 6 6 v36 a6 6 0 0 1 -6 6 h-44 a6 6 0 0 1 -6 -6 v-36 a6 6 0 0 1 6 -6 z" fill="url(#pc-jug)" stroke="#075985" stroke-width="2"/>
  <rect x="245" y="114" width="18" height="16" rx="3" fill="#075985"/>
  <rect x="236" y="142" width="36" height="22" rx="3" fill="#f0f9ff"/>
  <text x="254" y="158" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#075985">ACID</text>

  <!-- keep-apart marker between them -->
  <line x1="150" y1="118" x2="206" y2="118" stroke="#9a3412" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="150" y1="170" x2="206" y2="170" stroke="#9a3412" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="178" cy="144" r="17" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
  <line x1="168" y1="134" x2="188" y2="154" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="134" x2="168" y2="154" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>

  <!-- goggles and gloves on lower shelf -->
  <circle cx="78" cy="252" r="14" fill="#f0f9ff" stroke="#0369a1" stroke-width="3"/>
  <circle cx="108" cy="252" r="14" fill="#f0f9ff" stroke="#0369a1" stroke-width="3"/>
  <line x1="92" y1="252" x2="94" y2="252" stroke="#0369a1" stroke-width="4"/>
  <path d="M64 246 h-12" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
  <path d="M122 246 h12" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>

  <path d="M188 236 h30 a5 5 0 0 1 5 5 v30 a7 7 0 0 1 -7 7 h-26 a7 7 0 0 1 -7 -7 v-30 a5 5 0 0 1 5 -5 z" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
  <path d="M190 236 v-12 a4 4 0 0 1 8 0 v12" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
  <path d="M202 236 v-16 a4 4 0 0 1 8 0 v16" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
  <path d="M214 236 v-11 a4 4 0 0 1 8 0 v11" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>

  <text x="171" y="302" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">Dry, locked, stored apart</text>

  <!-- safety card, right -->
  <rect x="334" y="44" width="238" height="272" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="334" y="44" width="238" height="38" rx="10" fill="#0c4a6e"/>
  <rect x="334" y="70" width="238" height="12" fill="#0c4a6e"/>
  <text x="354" y="69" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Four Moments</text>

  <circle cx="362" cy="108" r="11" fill="#0369a1"/>
  <text x="362" y="113" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="382" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">The shelf</text>
  <text x="382" y="121" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">What sits next to what</text>

  <circle cx="362" cy="156" r="11" fill="#0369a1"/>
  <text x="362" y="161" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="382" y="154" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">The lid</text>
  <text x="382" y="169" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Fumes when it opens</text>

  <circle cx="362" cy="204" r="11" fill="#0369a1"/>
  <text x="362" y="209" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="382" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">The scoop</text>
  <text x="382" y="217" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Chemical into water</text>

  <circle cx="362" cy="252" r="11" fill="#0369a1"/>
  <text x="362" y="257" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="382" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">The re-entry</text>
  <text x="382" y="265" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Wait what the label says</text>

  <rect x="350" y="280" width="206" height="24" rx="5" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
  <text x="453" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7c2d12">Poison Help 1-800-222-1222</text>

  <text x="300" y="340" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0c4a6e">WaterWiseKids.com &#8212; free printable pool chemical safety card</text>
</svg>
