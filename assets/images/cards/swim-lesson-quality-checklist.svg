<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Swim lesson quality checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- pool tile band -->
  <rect x="0" y="196" width="600" height="16" fill="#bae6fd"/>
  <rect x="0" y="196" width="600" height="16" fill="none"/>
  <g fill="#7dd3fc">
    <rect x="20" y="198" width="24" height="12"/><rect x="68" y="198" width="24" height="12"/><rect x="116" y="198" width="24" height="12"/><rect x="164" y="198" width="24" height="12"/><rect x="212" y="198" width="24" height="12"/><rect x="260" y="198" width="24" height="12"/>
  </g>
  <!-- pool water -->
  <rect x="0" y="212" width="600" height="148" fill="url(#water)"/>
  <!-- lane rope -->
  <g>
    <line x1="0" y1="238" x2="600" y2="238" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="10 8" opacity="0.6"/>
  </g>
  <!-- ripples -->
  <path d="M40 300 q28 -10 56 0 t56 0 t56 0" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <path d="M70 326 q28 -10 56 0 t56 0 t56 0 t56 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
  <!-- instructor (adult) in water, one arm supporting -->
  <g transform="translate(150,214)">
    <!-- head -->
    <circle cx="0" cy="0" r="15" fill="#e7b48f"/>
    <path d="M-15 -3 q15 -20 30 0 q-15 -8 -30 0 Z" fill="#6b4423"/>
    <!-- torso in teal instructor rashguard -->
    <rect x="-16" y="14" width="32" height="40" rx="12" fill="#0d9488"/>
    <rect x="-16" y="30" width="32" height="6" fill="#5eead4"/>
    <!-- supporting arm reaching to child -->
    <rect x="14" y="20" width="46" height="10" rx="5" fill="#e7b48f" transform="rotate(10 14 20)"/>
  </g>
  <!-- child learner floating, within reach, on back -->
  <g transform="translate(232,246)">
    <!-- body -->
    <rect x="-6" y="-8" width="54" height="18" rx="9" fill="#fbbf24"/>
    <!-- head -->
    <circle cx="52" cy="1" r="12" fill="#fcd9b6"/>
    <path d="M40 -3 q12 -14 24 0 q-12 -6 -24 0 Z" fill="#7c2d12"/>
    <!-- little arms out -->
    <rect x="6" y="-14" width="8" height="18" rx="4" fill="#fcd9b6"/>
    <rect x="22" y="6" width="8" height="16" rx="4" fill="#fcd9b6"/>
    <!-- bubbles -->
    <circle cx="70" cy="-6" r="3" fill="#e0f2fe"/>
    <circle cx="78" cy="-1" r="2" fill="#e0f2fe"/>
  </g>
  <!-- quality badge / clipboard with star + checks -->
  <g transform="translate(392,150)">
    <rect x="0" y="0" width="152" height="152" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- clipboard -->
    <rect x="22" y="18" width="52" height="70" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
    <rect x="38" y="12" width="20" height="10" rx="3" fill="#0369a1"/>
    <line x1="30" y1="36" x2="66" y2="36" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="50" x2="66" y2="50" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="64" x2="58" y2="64" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <!-- quality star -->
    <path d="M48 96 l6 13 l14 2 l-10 10 l3 14 l-13 -7 l-13 7 l3 -14 l-10 -10 l14 -2 Z" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- checklist ticks -->
    <g transform="translate(86,26)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 9 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="4" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="30" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 39 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="34" width="34" height="10" rx="5" fill="#cbd5e1"/>
      <rect x="0" y="60" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <path d="M4 69 l4 4 l7 -9" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="64" width="34" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>
  <!-- title strip -->
  <rect x="0" y="316" width="600" height="44" fill="#0369a1"/>
  <text x="24" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Swim Lesson Quality Checklist for Parents</text>
</svg>
