<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="A swim lesson cost worksheet on a clipboard with a calculator and dollar figures, above a pool">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="300" height="180" fill="url(#sky)"/>

  <!-- water band at the bottom -->
  <rect y="140" width="300" height="40" fill="url(#water)"/>
  <g stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M18 154 q10 -6 20 0 t20 0"/>
    <path d="M212 164 q10 -6 20 0 t20 0"/>
    <path d="M104 170 q10 -6 20 0 t20 0"/>
  </g>
  <!-- pool deck edge -->
  <rect y="132" width="300" height="8" fill="#e2e8f0"/>
  <rect y="132" width="300" height="2.5" fill="#cbd5e1"/>

  <!-- worksheet on a clipboard -->
  <g>
    <rect x="38" y="20" width="122" height="108" rx="5" fill="#cbd5e1"/>
    <rect x="44" y="28" width="110" height="96" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="86" y="15" width="26" height="11" rx="3" fill="#64748b"/>
    <!-- title bar -->
    <rect x="52" y="36" width="62" height="7" rx="3.5" fill="#0369a1"/>
    <!-- line items with dollar blanks -->
    <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
      <line x1="52" y1="56" x2="104" y2="56"/>
      <line x1="52" y1="70" x2="98" y2="70"/>
      <line x1="52" y1="84" x2="106" y2="84"/>
      <line x1="52" y1="98" x2="94" y2="98"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#0284c7" text-anchor="end">
      <text x="146" y="59">$</text>
      <text x="146" y="73">$</text>
      <text x="146" y="87">$</text>
      <text x="146" y="101">$</text>
    </g>
    <!-- total rule and bold total -->
    <line x1="52" y1="108" x2="146" y2="108" stroke="#0c4a6e" stroke-width="2"/>
    <rect x="52" y="112" width="40" height="7" rx="3.5" fill="#0c4a6e"/>
    <text x="146" y="119" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#0c4a6e" text-anchor="end">$$</text>
  </g>

  <!-- calculator -->
  <g>
    <rect x="182" y="46" width="74" height="82" rx="7" fill="#0c4a6e"/>
    <rect x="190" y="55" width="58" height="18" rx="3" fill="#e0f2fe"/>
    <g stroke="#0369a1" stroke-width="2.5" stroke-linecap="round">
      <line x1="226" y1="65" x2="242" y2="65"/>
    </g>
    <g fill="#38bdf8">
      <rect x="190" y="80" width="15" height="12" rx="3"/>
      <rect x="211" y="80" width="15" height="12" rx="3"/>
      <rect x="232" y="80" width="16" height="12" rx="3"/>
      <rect x="190" y="97" width="15" height="12" rx="3"/>
      <rect x="211" y="97" width="15" height="12" rx="3"/>
      <rect x="190" y="114" width="15" height="10" rx="3"/>
      <rect x="211" y="114" width="15" height="10" rx="3"/>
    </g>
    <rect x="232" y="97" width="16" height="27" rx="3" fill="#f59e0b"/>
  </g>

  <!-- two small swimmer heads in the water: the sibling-discount cue -->
  <g>
    <circle cx="60" cy="152" r="7" fill="#fcd9b8"/>
    <path d="M53 150 a7 7 0 0 1 14 0 q-7 -4 -14 0 z" fill="#5b3a1a"/>
    <circle cx="82" cy="158" r="6" fill="#e8b58a"/>
    <path d="M76 156 a6 6 0 0 1 12 0 q-6 -3 -12 0 z" fill="#1f2937"/>
  </g>
</svg>
