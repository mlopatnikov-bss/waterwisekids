<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A swim progress audit worksheet on a clipboard beside a stack of level ribbons and a magnifying glass at the pool edge">
  <defs>
    <linearGradient id="aud-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="aud-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#aud-bg)"/>

  <!-- pool water band -->
  <rect x="0" y="268" width="600" height="92" fill="url(#aud-water)" opacity="0.55"/>
  <path d="M0 274 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#0369a1" stroke-width="3" opacity="0.45"/>

  <!-- clipboard with the audit worksheet -->
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="214" height="222" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="74" y="-9" width="66" height="20" rx="6" fill="#94a3b8"/>
    <text x="20" y="36" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#0c4a6e">PROGRESS AUDIT</text>
    <line x1="20" y1="46" x2="194" y2="46" stroke="#e2e8f0" stroke-width="2"/>

    <!-- column heads -->
    <text x="20" y="62" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569">AWARD</text>
    <text x="132" y="62" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#475569">REAL SKILL?</text>

    <!-- verified row -->
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="82" x2="112" y2="82"/>
    </g>
    <rect x="150" y="72" width="17" height="17" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M154 81 l4 5 l8 -10" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- verified row -->
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="114" x2="100" y2="114"/>
    </g>
    <rect x="150" y="104" width="17" height="17" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <path d="M154 113 l4 5 l8 -10" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- failed row -->
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="146" x2="118" y2="146"/>
    </g>
    <rect x="150" y="136" width="17" height="17" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/>
    <path d="M154 140 l9 9 M163 140 l-9 9" fill="none" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/>

    <!-- verdict row -->
    <rect x="20" y="176" width="174" height="22" rx="5" fill="#fff7ed" stroke="#9a3412" stroke-width="2.5"/>
    <text x="30" y="191" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#7c2d12">ASK: WHICH SKILL?</text>
  </g>

  <!-- stack of level ribbons -->
  <g transform="translate(300,132)">
    <g transform="translate(0,0)">
      <circle cx="34" cy="34" r="26" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/>
      <path d="M20 56 l-8 34 l22 -13 l22 13 l-8 -34" fill="#0ea5e9" stroke="#0369a1" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="34" cy="34" r="11" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
    </g>
    <g transform="translate(74,22)">
      <circle cx="34" cy="34" r="26" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
      <path d="M20 56 l-8 34 l22 -13 l22 13 l-8 -34" fill="#f59e0b" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="34" cy="34" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
    </g>
  </g>

  <!-- magnifying glass over the ribbons -->
  <g transform="translate(414,150)">
    <circle cx="46" cy="46" r="40" fill="#ffffff" fill-opacity="0.55" stroke="#0c4a6e" stroke-width="7"/>
    <path d="M76 76 l30 30" stroke="#0c4a6e" stroke-width="11" stroke-linecap="round"/>
    <path d="M30 46 l11 12 l21 -25" fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lane rope -->
  <g transform="translate(0,300)">
    <circle cx="70" cy="0" r="9" fill="#fbbf24" opacity="0.85"/>
    <circle cx="98" cy="0" r="9" fill="#f8fafc" opacity="0.85"/>
    <circle cx="126" cy="0" r="9" fill="#fbbf24" opacity="0.85"/>
    <circle cx="474" cy="0" r="9" fill="#f8fafc" opacity="0.85"/>
    <circle cx="502" cy="0" r="9" fill="#fbbf24" opacity="0.85"/>
    <circle cx="530" cy="0" r="9" fill="#f8fafc" opacity="0.85"/>
  </g>
</svg>
