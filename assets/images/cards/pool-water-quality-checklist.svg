<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="A parent at the pool edge holding a water test strip and clipboard, checking clear pool water with the main drain visible on the bottom">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="300" height="180" fill="url(#sky)"/>

  <!-- magnifier over clear water -->
  <g opacity="0.9">
    <circle cx="212" cy="46" r="24" fill="#ffffff" stroke="#bae6fd" stroke-width="3"/>
    <line x1="229" y1="63" x2="243" y2="77" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
    <text x="212" y="53" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0284c7" text-anchor="middle">pH</text>
  </g>

  <!-- test strip colour scale -->
  <g>
    <rect x="96" y="24" width="66" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="102" y="29" width="12" height="8" rx="2" fill="#fde68a"/>
    <rect x="117" y="29" width="12" height="8" rx="2" fill="#86efac"/>
    <rect x="132" y="29" width="12" height="8" rx="2" fill="#5eead4"/>
    <rect x="147" y="29" width="10" height="8" rx="2" fill="#38bdf8"/>
  </g>

  <!-- pool deck -->
  <rect y="112" width="300" height="10" fill="#e2e8f0"/>
  <rect y="112" width="300" height="3" fill="#cbd5e1"/>

  <!-- water -->
  <rect y="122" width="300" height="58" fill="url(#water)"/>
  <g stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M14 134 q10 -6 20 0 t20 0"/>
    <path d="M206 146 q10 -6 20 0 t20 0"/>
    <path d="M70 170 q10 -6 20 0 t20 0"/>
  </g>

  <!-- main drain visible on the bottom (the look test) -->
  <g opacity="0.85">
    <rect x="164" y="158" width="34" height="14" rx="3" fill="#075985" stroke="#bae6fd" stroke-width="2"/>
    <g stroke="#bae6fd" stroke-width="2" stroke-linecap="round">
      <line x1="171" y1="161" x2="171" y2="169"/>
      <line x1="181" y1="161" x2="181" y2="169"/>
      <line x1="191" y1="161" x2="191" y2="169"/>
    </g>
  </g>

  <!-- parent with clipboard and test strip (left, on deck) -->
  <g>
    <circle cx="52" cy="66" r="13" fill="#fcd9b8"/>
    <path d="M39 64 a13 13 0 0 1 26 0 q-13 -7 -26 0 z" fill="#5b3a1a"/>
    <path d="M38 112 v-28 a14 14 0 0 1 28 0 v28 z" fill="#0ea5e9"/>
    <rect x="60" y="86" width="22" height="27" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="66" y="83" width="10" height="6" rx="2" fill="#94a3b8"/>
    <g stroke="#0284c7" stroke-width="2.5" stroke-linecap="round">
      <line x1="65" y1="95" x2="77" y2="95"/>
      <line x1="65" y1="101" x2="77" y2="101"/>
      <line x1="65" y1="107" x2="73" y2="107"/>
    </g>
  </g>

  <!-- lifeguard / operator with test kit (right, on deck) -->
  <g>
    <circle cx="252" cy="66" r="13" fill="#e8b58a"/>
    <path d="M239 64 a13 13 0 0 1 26 0 q-13 -8 -26 0 z" fill="#1f2937"/>
    <path d="M238 112 v-28 a14 14 0 0 1 28 0 v28 z" fill="#dc2626"/>
    <rect x="224" y="88" width="14" height="20" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="227" y="97" width="8" height="9" rx="1.5" fill="#5eead4"/>
    <circle cx="251" cy="100" r="4" fill="#fbbf24" stroke="#f8fafc" stroke-width="1.5"/>
  </g>
</svg>
