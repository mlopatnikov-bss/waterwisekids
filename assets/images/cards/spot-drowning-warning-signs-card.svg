<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="How to spot drowning: the silent warning signs at the waterline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <rect y="150" width="600" height="210" fill="url(#water)"/>
  <!-- water surface ripples -->
  <g stroke="#7dd3fc" stroke-width="3" fill="none" opacity="0.7">
    <path d="M0 150 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    <path d="M0 178 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" opacity="0.5"/>
  </g>
  <!-- silent badge -->
  <g transform="translate(300 66)">
    <rect x="-92" y="-30" width="184" height="60" rx="30" fill="#b91c1c"/>
    <text x="0" y="7" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="2">SILENT</text>
  </g>
  <text x="300" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0c4a6e">Drowning has no splashing. No yelling.</text>
  <!-- drowning figure: head low, mouth at waterline, tilted back, vertical -->
  <g transform="translate(300 150)">
    <!-- submerged body, vertical, arms pressing down -->
    <g fill="#0c4a6e" opacity="0.55">
      <rect x="-15" y="20" width="30" height="95" rx="14"/>
      <rect x="-46" y="26" width="34" height="16" rx="8" transform="rotate(28 -46 26)"/>
      <rect x="12" y="26" width="34" height="16" rx="8" transform="rotate(-28 46 26)"/>
    </g>
    <!-- head at surface, tilted back, mouth open at water line -->
    <circle cx="0" cy="0" r="26" fill="#fcd9b6"/>
    <path d="M-26 4 a26 26 0 0 0 52 0 z" fill="#0369a1" opacity="0.35"/>
    <!-- hair over forehead -->
    <path d="M-24 -8 q10 -20 24 -6 q8 -14 22 2" fill="none" stroke="#5b3a1a" stroke-width="5" stroke-linecap="round"/>
    <!-- open mouth -->
    <ellipse cx="0" cy="9" rx="6" ry="4" fill="#7f1d1d"/>
    <!-- glassy eyes -->
    <circle cx="-9" cy="-4" r="2.6" fill="#334155"/>
    <circle cx="9" cy="-4" r="2.6" fill="#334155"/>
  </g>
  <text x="300" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#e0f2fe">Head low · mouth at the surface · eyes blank · no kicking</text>
</svg>
