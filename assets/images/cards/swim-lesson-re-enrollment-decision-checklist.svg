<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="A checklist with four options: keep, move up, repeat and pause, with one option checked, beside a swim bag">
  <defs>
    <linearGradient id="re-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="re-pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#re-bg)"/>
  <rect x="0" y="290" width="600" height="70" fill="url(#re-pool)"/>
  <path d="M0 308 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.7"/>
  <rect x="70" y="30" width="340" height="245" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <rect x="190" y="18" width="100" height="26" rx="8" fill="#0369a1"/>
  <text x="240" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#0c4a6e">NEXT SESSION?</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#1f2937">
    <rect x="88" y="86" width="304" height="38" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="130" y="110" font-weight="700">Keep the class</text>
    <rect x="88" y="130" width="304" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="130" y="154" font-weight="700">Move up a level</text><path d="M100 148 l6 6 l12 -14" fill="none" stroke="#16a34a" stroke-width="4"/>
    <rect x="88" y="174" width="304" height="38" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="130" y="198" font-weight="700">Repeat a level</text>
    <rect x="88" y="218" width="304" height="38" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="130" y="242" font-weight="700">Pause, with a plan</text>
  </g>
  <rect x="440" y="170" width="110" height="100" rx="14" fill="#0369a1"/><rect x="465" y="156" width="60" height="24" rx="10" fill="none" stroke="#0c4a6e" stroke-width="6"/><circle cx="495" cy="220" r="18" fill="#7dd3fc"/>
</svg>
