<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Pool closing safety checklist illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#sky)"/>
  <!-- ground -->
  <rect x="0" y="250" width="600" height="110" fill="#eef2f7"/>
  <!-- deck -->
  <rect x="60" y="196" width="480" height="128" rx="14" fill="#cbd5e1"/>
  <rect x="72" y="208" width="456" height="104" rx="10" fill="#e2e8f0"/>
  <!-- covered pool -->
  <rect x="120" y="224" width="360" height="74" rx="10" fill="url(#cover)"/>
  <!-- taut cover straps -->
  <g stroke="#bae6fd" stroke-width="3" opacity="0.8">
    <line x1="120" y1="248" x2="480" y2="248"/>
    <line x1="120" y1="274" x2="480" y2="274"/>
    <line x1="210" y1="224" x2="210" y2="298"/>
    <line x1="300" y1="224" x2="300" y2="298"/>
    <line x1="390" y1="224" x2="390" y2="298"/>
  </g>
  <!-- anchors -->
  <g fill="#0c4a6e">
    <circle cx="120" cy="224" r="5"/><circle cx="300" cy="224" r="5"/><circle cx="480" cy="224" r="5"/>
    <circle cx="120" cy="298" r="5"/><circle cx="300" cy="298" r="5"/><circle cx="480" cy="298" r="5"/>
  </g>
  <!-- safety fence -->
  <g stroke="#475569" stroke-width="6" stroke-linecap="round">
    <line x1="96" y1="150" x2="96" y2="210"/>
    <line x1="150" y1="150" x2="150" y2="210"/>
    <line x1="204" y1="150" x2="204" y2="210"/>
    <line x1="258" y1="150" x2="258" y2="210"/>
    <line x1="86" y1="164" x2="268" y2="164"/>
    <line x1="86" y1="198" x2="268" y2="198"/>
  </g>
  <!-- falling leaves -->
  <g fill="#f59e0b">
    <path d="M430 96 q14 -12 28 0 q-14 12 -28 0 z"/>
    <path d="M486 140 q12 -10 24 0 q-12 10 -24 0 z" fill="#ea580c"/>
    <path d="M400 150 q10 -9 20 0 q-10 9 -20 0 z" fill="#d97706"/>
  </g>
  <!-- checklist card -->
  <g>
    <rect x="360" y="70" width="150" height="120" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="3"/>
    <rect x="360" y="70" width="150" height="30" rx="12" fill="#0284c7"/>
    <rect x="360" y="88" width="150" height="12" fill="#0284c7"/>
    <g fill="#0f766e">
      <circle cx="380" cy="122" r="7"/><circle cx="380" cy="148" r="7"/><circle cx="380" cy="174" r="7"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M376 122 l3 3 l5 -6"/><path d="M376 148 l3 3 l5 -6"/><path d="M376 174 l3 3 l5 -6"/>
    </g>
    <g fill="#cbd5e1">
      <rect x="396" y="117" width="98" height="9" rx="4"/>
      <rect x="396" y="143" width="98" height="9" rx="4"/>
      <rect x="396" y="169" width="80" height="9" rx="4"/>
    </g>
  </g>
  <!-- title -->
  <text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0c4a6e">Pool Closing Safety</text>
  <text x="40" y="84" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#0369a1">Keep a closed pool safe all winter</text>
  <!-- brand -->
  <text x="40" y="342" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0284c7">WaterWiseKids.com</text>
</svg>
